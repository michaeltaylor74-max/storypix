s, or play the video and press I (start) / O (end) at the right moments. Space plays and pauses; ← → step one frame.\"));\n\n  update();\n  document.addEventListener(\"keydown\", keys, true);\n  raf = requestAnimationFrame(tick);\n  video.addEventListener(\"loadedmetadata\", () => { seek(start); buildStrip(m, strip, dur); }, { once: true });\n\n  const ok = await modal({\n    title: h(\"span\", { class: \"ic-lbl\" }, icon(\"scissors\", 18), `Trim video — ${m.name}`),\n    wide: true,\n    body,\n    buttons: [{ label: \"Cancel\", value: false }, { label: \"Use this part\", value: true, primary: true }],\n  });\n  document.removeEventListener(\"keydown\", keys, true);\n  cancelAnimationFrame(raf);\n  video.pause();\n  video.removeAttribute(\"src\");\n  video.load();\n  if (!ok) return;\n  change(() => {\n    tile.trimStart = Math.round(start * 100) / 100;\n    tile.trimEnd = end >= dur - 0.05 ? null : Math.round(end * 100) / 100;\n    if (m.hasAudio) tile.muted = muteChk.checked;\n    if (fitChk.checked) slide.duration = Math.max(0.5, Math.round((end - start) * 10) / 10);\n  });\n}\n\n/** Draw a filmstrip of frames along the trim bar (best effort). */\nasync function buildStrip(m, canvas, dur) {\n  const ctx = canvas.getContext(\"2d\");\n  ctx.fillStyle = \"#11141a\";\n  ctx.fillRect(0, 0, canvas.width, canvas.height);\n  const v = document.createElement(\"video\");\n  v.muted = true;\n  v.preload = \"auto\";\n  v.src = assets.videoSrc(m);\n  try {\n    await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = rej; setTimeout(rej, 8000); });\n    const n = 12, w = canvas.width / n, hgt = canvas.height;\n    for (let i = 0; i < n; i++) {\n      if (!canvas.isConnected) break;\n      v.currentTime = Math.min(dur - 0.05, ((i + 0.5) / n) * dur);\n      await new Promise((res) => { v.onseeked = res; setTimeout(res, 2500); });\n      const iw = v.videoWidth || 16, ih = v.videoHeight || 9;\n      const s = Math.max(w / iw, hgt / ih);\n      ctx.save();\n      ctx.beginPath(); ctx.rect(i * w, 0, w - 1, hgt); ctx.clip();\n      ctx.drawImage(v, i * w + (w - iw * s) / 2, (hgt - ih * s) / 2, iw * s, ih * s);\n      ctx.restore();\n    }\n  } catch { /* leave the plain bar */ }\n  v.removeAttribute(\"src\");\n  v.load();\n}\n"},{"name":"storyboard.js","code":"// Bottom storyboard: slide strip with thumbnails, transitions, reordering, drops.\nimport { h, beginDrag, contextMenu, toast, modal, icon } from \"./ui.js\";\nimport { app, on, emit, change, selectSlide, selectedSlides, insertSlides, deleteSlides, duplicateSlides, slideForMedia, slideDefaults, applyLayout } from \"./state.js\";\nimport { drawSlide } from \"./render.js\";\nimport { assets } from \"./assets.js\";\nimport { openTrim } from \"./trim.js\";\nimport { TRANSITIONS, newSlide, newTitleSlide, computeTimeline, fmtTime, slideKind, TRANSITION_SETS, LAYOUTS } from \"./model.js\";\n\nlet root, strip, cardW = 168;\nconst thumbs = new Map(); // slide id -> {sig, canvas, incomplete}\n\nexport function initStoryboard(el) {\n  root = el;\n  on(\"change\", (d) => { if (!d?.light) render(); else refreshThumbs(); });\n  on(\"select\", () => markSelection());\n  on(\"playhead\", (i) => markPlaying(i));\n  assets.onLoad(() => refreshThumbs(true));\n  render();\n}\n\nfunction transIcon(kind) { return icon(TRANSITIONS.find((t) => t.id === kind)?.icon || \"tFade\", 15); }\n\nfunction thumbFor(slide) {\n  const sig = JSON.stringify(slide);\n  let t = thumbs.get(slide.id);\n  if (t && t.sig === sig && !t.incomplete) return t.canvas;\n  if (!t) {\n    const c = document.createElement(\"canvas\");\n    c.width = 192; c.height = 108;\n    t = { canvas: c };\n    thumbs.set(slide.id, t);\n  }\n  t.sig = sig;\n  const ctx = t.canvas.getContext(\"2d\");\n  drawSlide(ctx, app.project, slide, 0, 192, 108, \"thumb\", app.mediaById);\n  t.incomplete = slide.tiles.some((tl) => { const m = tl.mediaId && app.mediaById.get(tl.mediaId); return m && !assets.image(m, \"thumb\"); })\n    || (slide.background.kind === \"blur\" && false);\n  return t.canvas;\n}\n\nfunction refreshThumbs(onlyIncomplete = false) {\n  if (!strip) return;\n  for (const s of app.project.slides) {\n    const t = thumbs.get(s.id);\n    if (onlyIncomplete && t && !t.incomplete) continue;\n    const c = thumbFor(s);\n    const holder = strip.querySelector(`.sb-card[data-id=\"${s.id}\"] .sb-thumb`);\n    if (holder && holder.firstChild !== c) holder.replaceChildren(c);\n  }\n}\n\nfunction markSelection() {\n  if (!strip) return;\n  strip.querySelectorAll(\".sb-card\").forEach((c) => {\n    c.classList.toggle(\"sel\", app.sel.slides.has(c.dataset.id));\n    c.classList.toggle(\"current\", app.sel.current === c.dataset.id);\n  });\n  const cur = strip.querySelector(\".sb-card.current\");\n  if (cur && !app.playing) {\n    const r = cur.getBoundingClientRect(), sr = strip.getBoundingClientRect();\n    if (r.left < sr.left || r.right > sr.right) cur.scrollIntoView({ block: \"nearest\", inline: \"nearest\" });\n  }\n}\nfunction markPlaying(i) {\n  if (!strip) return;\n  strip.querySelectorAll(\".sb-card.playing\").forEach((c) => c.classList.remove(\"playing\"));\n  const s = app.project.slides[i];\n  const c = s && strip.querySelector(`.sb-card[data-id=\"${s.id}\"]`);\n  if (c) {\n    c.classList.add(\"playing\");\n    const r = c.getBoundingClientRect(), sr = strip.getBoundingClientRect();\n    if (r.left < sr.left || r.right > sr.right) strip.scrollLeft += r.left - sr.left - 40;\n  }\n}\n\nfunction render() {\n  if (!root) return;\n  const p = app.project;\n  const tl = computeTimeline(p);\n  const scroll = strip?.scrollLeft || 0;\n  const sel = selectedSlides();\n  const live = new Set(p.slides.map((s) => s.id));\n  for (const id of thumbs.keys()) if (!live.has(id)) thumbs.delete(id);\n\n  const tools = h(\"div\", { class: \"sb-tools\" },\n    h(\"button\", { class: \"btn small\", onclick: (e) => blankMenu(e) }, icon(\"plus\", 14), \"Slide\", icon(\"chevronDown\", 12)),\n    h(\"button\", { class: \"btn small\", onclick: () => insertSlides([newTitleSlide(\"Title\", \"\", slideDefaults())]) }, icon(\"plus\", 14), \"Title card\"),\n    h(\"span\", { class: \"sep\" }),\n    h(\"button\", { class: \"btn small\", disabled: !sel.length, onclick: () => duplicateSlides(sel.map((s) => s.id)) }, icon(\"copy\", 14), \"Duplicate\"),\n    h(\"button\", { class: \"btn small\", disabled: !sel.length, onclick: () => deleteSlides(sel.map((s) => s.id)) }, icon(\"trash\", 14), \"Delete\"),\n    h(\"span\", { class: \"sep\" }),\n    h(\"button\", { class: \"btn small\", disabled: !p.slides.length, onclick: (e) => transitionMenu(e) }, icon(\"tFade\", 14), \"Transitions\", icon(\"chevronDown\", 12)),\n    h(\"button\", { class: \"btn small\", disabled: !p.slides.length, onclick: () => timingDialog() }, icon(\"clock\", 14), \"Timing…\"),\n    h(\"span\", { class: \"grow\" }),\n    h(\"span\", { class: \"sb-info\" }, `${p.slides.length} slide${p.slides.length === 1 ? \"\" : \"s\"}${sel.length > 1 ? ` (${sel.length} selected)` : \"\"} · ${fmtTime(tl.total)}`),\n    h(\"input\", { type: \"range\", min: 110, max: 260, value: cardW, title: \"Card size\", oninput: (e) => { cardW = +e.target.value; strip.style.setProperty(\"--card\", `${cardW}px`); } }));\n\n  strip = h(\"div\", { class: \"sb-strip\", style: { \"--card\": `${cardW}px` } });\n  strip.addEventListener(\"wheel\", (e) => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { strip.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });\n  const indicator = h(\"div\", { class: \"sb-indicator\" });\n  p.slides.forEach((s, i) => {\n    const k = slideKind(p, s, app.mediaById);\n    if (i > 0 || s.transition.kind !== \"cut\") {\n      strip.append(h(\"div\", { class: \"sb-trans\", title: `${TRANSITIONS.find((t) => t.id === s.transition.kind)?.label} (${s.transition.duration}s) — click to change`, onclick: () => { selectSlide(s.id); emit(\"focus\", \"transition\"); } }, transIcon(s.transition.kind)));\n    }\n    const card = h(\"div\", { class: `sb-card ${app.sel.slides.has(s.id) ? \"sel\" : \"\"} ${app.sel.current === s.id ? \"current\" : \"\"}`, \"data-id\": s.id },\n      h(\"div\", { class: \"sb-thumb\" }, thumbFor(s)),\n      h(\"div\", { class: \"sb-meta\" },\n        h(\"span\", { class: \"sb-num\" }, i + 1),\n        k.hasVideo ? h(\"span\", { title: \"Has video\" }, icon(\"film\", 13)) : null,\n        s.texts.length ? h(\"span\", { title: \"Has text\" }, \"T\") : null,\n        k.empty && s.tiles.length ? h(\"span\", { class: \"warn-ic\", title: `${k.empty} empty box(es)` }, icon(\"alert\", 13)) : null,\n        h(\"span\", { class: \"grow\" }),\n        h(\"span\", { class: \"sb-dur\" }, `${s.duration.toFixed(1)}s`)));\n    card.addEventListener(\"click\", (e) => selectSlide(s.id, e.shiftKey ? \"range\" : e.ctrlKey || e.metaKey ? \"toggle\" : \"single\"));\n    card.addEventListener(\"pointerdown\", (e) => {\n      if (e.button !== 0) return;\n      const ids = app.sel.slides.has(s.id) ? p.slides.filter((x) => app.sel.slides.has(x.id)).map((x) => x.id) : [s.id];\n      beginDrag(e, { type: \"slides\", ids }, () => h(\"div\", {}, ids.length > 1 ? `Move ${ids.length} slides` : `Move slide ${i + 1}`));\n    });\n    card.addEventListener(\"contextmenu\", (e) => {\n      e.preventDefault();\n      if (!app.sel.slides.has(s.id)) selectSlide(s.id);\n      const ids = selectedSlides().map((x) => x.id);\n      const vt = s.tiles.find((t) => app.mediaById.get(t.mediaId)?.kind === \"video\");\n      contextMenu(e.clientX, e.clientY, [\n        vt ? { label: \"Trim video…\", action: () => openTrim(s, vt) } : null,\n        { label: \"Duplicate\", action: () => duplicateSlides(ids) },\n        { label: \"Delete\", action: () => deleteSlides(ids) },\n        \"-\",\n        { label: \"Insert title card before\", action: () => insertSlides([newTitleSlide(\"Title\", \"\", slideDefaults())], p.slides.findIndex((x) => x.id === s.id)) },\n        { label: \"Insert title card after\", action: () => insertSlides([newTitleSlide(\"Title\", \"\", slideDefaults())], p.slides.findIndex((x) => x.id === s.id) + 1) },\n        \"-\",\n        { label: \"Use this transition for all slides\", action: () => change((p) => p.slides.forEach((x, j) => { if (j > 0 || x.transition.kind !== \"cut\") x.transition = { ...s.transition }; })) },\n        { label: \"Use this frame style for all slides\", action: () => change((p) => p.slides.forEach((x) => { if (x.tiles.length > 1) { x.style = { ...s.style }; x.stylePreset = s.stylePreset; } })) },\n      ]);\n    });\n    strip.append(card);\n  });\n  if (!p.slides.length) strip.append(h(\"div\", { class: \"sb-empty\" }, \"Your storyboard is empty. Drag photos here, double-click a photo in the library, or use Auto Build.\"));\n  strip.append(indicator);\n\n  // drop handling\n  let dropIndex = null, dropCard = null;\n  const clear = () => { indicator.style.display = \"none\"; strip.querySelectorAll(\".drop-into\").forEach((c) => c.classList.remove(\"drop-into\")); dropCard = null; };\n  strip._drop = {\n    accepts: (pl) => pl.type === \"media\" || pl.type === \"slides\",\n    over(pl, e) {\n      clear();\n      const cards = [...strip.querySelectorAll(\".sb-card\")];\n      dropIndex = cards.length;\n      for (let j = 0; j < cards.length; j++) {\n        const r = cards[j].getBoundingClientRect();\n        if (e.clientX < r.left + r.width / 2) {\n          if (pl.type === \"media\" && e.clientX > r.left + r.width * 0.25 && e.clientY > r.top && e.clientY < r.bottom) { dropCard = cards[j]; break; }\n          dropIndex = j; break;\n        }\n        if (pl.type === \"media\" && e.clientX < r.right - r.width * 0.25 && e.clientY > r.top && e.clientY < r.bottom) { dropCard = cards[j]; break; }\n      }\n      if (dropCard) { dropCard.classList.add(\"drop-into\"); return; }\n      const sr = strip.getBoundingClientRect();\n      let x;\n      if (!cards.length) x = 10;\n      else if (dropIndex < cards.length) x = cards[dropIndex].getBoundingClientRect().left - sr.left - 6 + strip.scrollLeft;\n      else x = cards[cards.length - 1].getBoundingClientRect().right - sr.left + 4 + strip.scrollLeft;\n      indicator.style.left = `${x}px`;\n      indicator.style.display = \"block\";\n      const edge = 60;\n      if (e.clientX < sr.left + edge) strip.scrollLeft -= 20;\n      if (e.clientX > sr.right - edge) strip.scrollLeft += 20;\n    },\n    leave: clear,\n    drop(pl) {\n      const into = dropCard?.dataset.id;\n      clear();\n      if (pl.type === \"slides\") {\n        const ids = new Set(pl.ids);\n        change((p) => {\n          const target = p.slides[dropIndex]?.id;\n          const moving = p.slides.filter((s) => ids.has(s.id));\n          const rest = p.slides.filter((s) => !ids.has(s.id));\n          let at = target ? rest.findIndex((s) => s.id === target) : rest.length;\n          if (at < 0) at = rest.length;\n          rest.splice(at, 0, ...moving);\n          p.slides = rest;\n        });\n        return;\n      }\n      if (into) {\n        const slide = p.slides.find((s) => s.id === into);\n        const existing = slide.tiles.filter((t) => t.mediaId).map((t) => t.mediaId);\n        const empties = slide.tiles.filter((t) => !t.mediaId);\n        change(() => {\n          if (empties.length >= pl.ids.length) pl.ids.forEach((id, j) => { empties[j].mediaId = id; });\n          else {\n            const all = [...existing, ...pl.ids].slice(0, 9);\n            const ns = slideForMedia(all);\n            slide.tiles = ns.tiles; slide.layoutId = ns.layoutId;\n            if (pl.ids.length + existing.length > 9) toast(\"A slide holds at most 9 photos\", \"warn\");\n          }\n        });\n        selectSlide(into);\n        return;\n      }\n      const slides = pl.ids.map((id) => slideForMedia([id]));\n      insertSlides(slides, dropIndex);\n    },\n  };\n  root.replaceChildren(tools, strip);\n  strip.scrollLeft = scroll;\n}\n\nfunction blankMenu(e) {\n  const r = e.currentTarget.getBoundingClientRect();\n  const counts = [1, 2, 3, 4, 5, 6, 7, 8, 9];\n  contextMenu(r.left, r.top - 10, counts.map((n) => ({\n    label: n === 1 ? \"1 photo (full screen)\" : `${n} photos`,\n    action: () => {\n      const l = LAYOUTS.find((x) => x.n === n);\n      const s = newSlide(l.id, slideDefaults());\n      insertSlides([s]);\n    },\n  })));\n}\n\nfunction transitionMenu(e) {\n  const r = e.currentTarget.getBoundingClientRect();\n  const sel = selectedSlides();\n  const target = () => (sel.length > 1 ? sel : app.project.slides);\n  const label = sel.length > 1 ? `${sel.length} selected slides` : \"all slides\";\n  const apply = (fn) => change(() => target().forEach((s, i) => fn(s, i)));\n  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];\n  contextMenu(r.left, r.top - 10, [\n    { label: `Applies to ${label}`, disabled: true, action: () => {} },\n    { label: \"Crossfade everywhere\", action: () => apply((s) => { s.transition.kind = \"crossfade\"; }) },\n    { label: \"Random — gentle mix\", action: () => apply((s) => { s.transition.kind = pick(TRANSITION_SETS.mixed); }) },\n    { label: \"Random — energetic mix\", action: () => apply((s) => { s.transition.kind = pick(TRANSITION_SETS.energetic); }) },\n    { label: \"No transitions (hard cuts)\", action: () => apply((s) => { s.transition.kind = \"cut\"; }) },\n    \"-\",\n    ...[0.5, 1, 1.5, 2].map((d) => ({ label: `Transition length ${d}s`, action: () => apply((s) => { s.transition.duration = d; }) })),\n  ]);\n}\n\nasync function timingDialog() {\n  const sel = selectedSlides();\n  const scope = h(\"select\", {}, h(\"option\", { value: \"all\" }, \"All photo slides\"), sel.length > 1 ? h(\"option\", { value: \"sel\", selected: true }, `${sel.length} selected slides`) : null);\n  const dur = h(\"input\", { type: \"number\", min: 1, max: 30, step: 0.5, value: app.project.settings.defaultDuration });\n  const v = await modal({\n    title: \"Slide timing\",\n    body: h(\"div\", { class: \"form\" },\n      h(\"label\", { class: \"row\" }, h(\"span\", { class: \"lbl\" }, \"Apply to\"), scope),\n      h(\"label\", { class: \"row\" }, h(\"span\", { class: \"lbl\" }, \"Seconds per slide\"), dur),\n      h(\"p\", { class: \"muted small\" }, \"Video slides keep their clip length. To match the music exactly, use ‘Fit show to music’ on the Music tab.\")),\n    buttons: [{ label: \"Cancel\", value: null }, { label: \"Apply\", value: () => ({ scope: scope.value, d: +dur.value }), primary: true }],\n  });\n  if (!v || !(v.d > 0)) return;\n  change((p) => {\n    const list = v.scope === \"sel\" ? selectedSlides() : p.slides;\n    for (const s of list) if (!slideKind(p, s, app.mediaById).hasVideo) s.duration = v.d;\n    p.settings.defaultDuration = v.d;\n  });\n}\n\nexport { applyLayout };\n"},{"name":"editor.js","code":"// Centre stage: draws the current slide and lets you move / resize / rotate boxes.\nimport { h, toast } from \"./ui.js\";\nimport { app, on, emit, change, currentSlide, selectItem, beginGesture, gestureUpdate, endGesture, insertSlides, slideForMedia } from \"./state.js\";\nimport { drawSlide } from \"./render.js\";\nimport { assets } from \"./assets.js\";\nimport { openTrim } from \"./trim.js\";\nimport { newText, newTile, placeMedia, clamp } from \"./model.js\";\nimport { FONT_FALLBACK } from \"./platform.js\";\n\nlet wrap, stage, canvas, overlay, banner, cssW = 0, cssH = 0, dpr = 1;\nlet drawQueued = false;\n\nexport const stageCanvas = () => canvas;\nexport const stageSize = () => ({ W: canvas.width, H: canvas.height });\n\nexport function initEditor(el) {\n  wrap = el;\n  canvas = h(\"canvas\", { class: \"stage-canvas\" });\n  overlay = h(\"div\", { class: \"stage-overlay\" });\n  banner = h(\"div\", { class: \"stage-banner\" });\n  stage = h(\"div\", { class: \"stage\" }, canvas, overlay, banner);\n  wrap.append(stage);\n  new ResizeObserver(layout).observe(wrap);\n  on(\"change\", () => { requestDraw(); buildOverlay(); });\n  on(\"select\", () => { requestDraw(); buildOverlay(); });\n  on(\"playing\", () => { buildOverlay(); requestDraw(); });\n  assets.onLoad(() => requestDraw());\n  overlay.addEventListener(\"pointerdown\", (e) => {\n    if (e.target === overlay) { selectItem(null); }\n  });\n  overlay.addEventListener(\"wheel\", onWheel, { passive: false });\n  setupDrop();\n  layout();\n}\n\nfunction layout() {\n  const r = wrap.getBoundingClientRect();\n  const maxW = Math.max(100, r.width - 24), maxH = Math.max(60, r.height - 24);\n  cssW = Math.floor(Math.min(maxW, (maxH * 16) / 9));\n  cssH = Math.floor((cssW * 9) / 16);\n  dpr = Math.min(2, window.devicePixelRatio || 1);\n  stage.style.width = `${cssW}px`;\n  stage.style.height = `${cssH}px`;\n  canvas.width = Math.round(cssW * dpr);\n  canvas.height = Math.round(cssH * dpr);\n  emit(\"stage-resize\");\n  requestDraw();\n}\n\nexport function requestDraw() {\n  if (drawQueued) return;\n  drawQueued = true;\n  requestAnimationFrame(() => { drawQueued = false; if (!app.playing) draw(); });\n}\n\nfunction draw() {\n  const ctx = canvas.getContext(\"2d\");\n  const s = currentSlide();\n  const W = canvas.width, H = canvas.height;\n  if (!s) {\n    ctx.fillStyle = \"#0c0d11\";\n    ctx.fillRect(0, 0, W, H);\n    ctx.fillStyle = \"#6b7280\";\n    ctx.textAlign = \"center\";\n    ctx.textBaseline = \"middle\";\n    ctx.font = `${Math.round(H / 22)}px ${FONT_FALLBACK}`;\n    ctx.fillText(\"Add photos, then double-click one (or drag it to the storyboard) to start.\", W / 2, H / 2 - H / 30);\n    ctx.fillText(\"Or press Auto Build to make a whole show from a folder.\", W / 2, H / 2 + H / 30);\n    return;\n  }\n  drawSlide(ctx, app.project, s, 0, W, H, \"edit\", app.mediaById);\n}\n\n// ---------- overlay boxes\nfunction buildOverlay() {\n  overlay.replaceChildren();\n  banner.style.display = \"none\";\n  const s = currentSlide();\n  if (!s || app.playing) return;\n  const mk = (kind, item) => {\n    const r = item.rect;\n    const sel = (kind === \"tile\" ? app.sel.tile : app.sel.text) === item.id;\n    const box = h(\"div\", {\n      class: `box ${kind} ${sel ? \"sel\" : \"\"} ${sel && app.panMode ? \"pan\" : \"\"}`,\n      style: { left: `${r.x * 100}%`, top: `${r.y * 100}%`, width: `${r.w * 100}%`, height: `${r.h * 100}%`, transform: `rotate(${item.rotation || 0}deg)` },\n      \"data-id\": item.id,\n    });\n    if (sel && !app.panMode) {\n      for (const hd of [\"nw\", \"n\", \"ne\", \"e\", \"se\", \"s\", \"sw\", \"w\"]) box.append(h(\"div\", { class: `hd hd-${hd}`, \"data-h\": hd }));\n      if (kind === \"tile\") box.append(h(\"div\", { class: \"hd-rot\", \"data-h\": \"rot\", title: \"Drag to rotate\" }));\n    }\n    box.addEventListener(\"pointerdown\", (e) => onBoxDown(e, kind, item, box));\n    box.addEventListener(\"dblclick\", () => {\n      if (kind === \"tile\" && item.mediaId) {\n        if (app.mediaById.get(item.mediaId)?.kind === \"video\") { openTrim(currentSlide(), item); return; }\n        app.panMode = !app.panMode; selectItem(\"tile\", item.id);\n      }\n      if (kind === \"text\") emit(\"focus\", \"text\");\n    });\n    return box;\n  };\n  for (const t of s.tiles) overlay.append(mk(\"tile\", t));\n  for (const t of s.texts) overlay.append(mk(\"text\", t));\n  if (app.panMode && app.sel.tile) {\n    banner.textContent = \"Drag the photo to reposition it · scroll to zoom · double-click or Esc when done\";\n    banner.style.display = \"block\";\n  }\n}\n\nfunction onBoxDown(e, kind, item, box) {\n  if (e.button !== 0) return;\n  e.stopPropagation();\n  const s = currentSlide();\n  const handle = e.target.dataset?.h;\n  if ((kind === \"tile\" ? app.sel.tile : app.sel.text) !== item.id) {\n    selectItem(kind, item.id);\n    if (kind === \"tile\") app.panMode = false;\n  }\n  const sx = e.clientX, sy = e.clientY;\n  const start = { ...item.rect }, startRot = item.rotation || 0, startFx = item.focusX, startFy = item.focusY;\n  let moved = false;\n  const others = [...s.tiles, ...s.texts].filter((o) => o.id !== item.id).map((o) => o.rect);\n  const mediaPan = kind === \"tile\" && app.panMode && item.mediaId;\n  const m = mediaPan ? app.mediaById.get(item.mediaId) : null;\n  const move = (ev) => {\n    const dx = (ev.clientX - sx) / cssW, dy = (ev.clientY - sy) / cssH;\n    if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 3) return;\n    if (!moved) { beginGesture(); moved = true; }\n    clearGuides();\n    if (mediaPan) {\n      const tw = item.rect.w * cssW, th = item.rect.h * cssH;\n      const [, , dw, dh] = placeMedia(item, tw, th, m.width, m.height, 1, 0.5, 0.5);\n      const ox = dw - tw, oy = dh - th;\n      if (ox > 1) item.focusX = clamp(startFx - (ev.clientX - sx) / ox, 0, 1);\n      if (oy > 1) item.focusY = clamp(startFy - (ev.clientY - sy) / oy, 0, 1);\n    } else if (handle === \"rot\") {\n      const br = box.getBoundingClientRect();\n      const cx = br.left + br.width / 2, cy = br.top + br.height / 2;\n      let a = (Math.atan2(ev.clientY - cy, ev.clientX - cx) * 180) / Math.PI + 90;\n      if (a > 180) a -= 360;\n      if (ev.shiftKey) a = Math.round(a / 15) * 15;\n      else if (Math.abs(a) < 3) a = 0;\n      item.rotation = Math.round(a * 10) / 10;\n    } else if (handle) {\n      const r = { ...start };\n      const min = 0.03;\n      if (handle.includes(\"e\")) r.w = Math.max(min, start.w + dx);\n      if (handle.includes(\"s\")) r.h = Math.max(min, start.h + dy);\n      if (handle.includes(\"w\")) { r.w = Math.max(min, start.w - dx); r.x = start.x + start.w - r.w; }\n      if (handle.includes(\"n\")) { r.h = Math.max(min, start.h - dy); r.y = start.y + start.h - r.h; }\n      if (ev.shiftKey && handle.length === 2) {\n        const asp = start.w / start.h;\n        if (r.w / r.h > asp) r.w = r.h * asp; else r.h = r.w / asp;\n        if (handle.includes(\"w\")) r.x = start.x + start.w - r.w;\n        if (handle.includes(\"n\")) r.y = start.y + start.h - r.h;\n      }\n      if (!ev.altKey) snapEdges(r, others, handle);\n      item.rect = r;\n    } else {\n      const r = { ...start, x: start.x + dx, y: start.y + dy };\n      if (!ev.altKey) snapMove(r, others);\n      item.rect = r;\n    }\n    gestureUpdate();\n    syncBox(box, item);\n  };\n  const up = () => {\n    window.removeEventListener(\"pointermove\", move);\n    window.removeEventListener(\"pointerup\", up);\n    clearGuides();\n    if (moved) { item.rect = roundRect(item.rect); endGesture(); if (kind === \"tile\" && handle && !mediaPan) { const sl = currentSlide(); if (sl) sl.layoutId = sl.layoutId; } }\n  };\n  window.addEventListener(\"pointermove\", move);\n  window.addEventListener(\"pointerup\", up);\n}\n\nconst roundRect = (r) => ({ x: +r.x.toFixed(4), y: +r.y.toFixed(4), w: +r.w.toFixed(4), h: +r.h.toFixed(4) });\n\nfunction syncBox(box, item) {\n  const r = item.rect;\n  Object.assign(box.style, { left: `${r.x * 100}%`, top: `${r.y * 100}%`, width: `${r.w * 100}%`, height: `${r.h * 100}%`, transform: `rotate(${item.rotation || 0}deg)` });\n  requestDraw();\n}\n\nfunction guide(axis, v) {\n  overlay.append(h(\"div\", { class: `guide ${axis}`, style: axis === \"x\" ? { left: `${v * 100}%` } : { top: `${v * 100}%` } }));\n}\nfunction clearGuides() { overlay.querySelectorAll(\".guide\").forEach((g) => g.remove()); }\n\nfunction snapMove(r, others) {\n  const tx = 7 / cssW, ty = 7 / cssH;\n  const xs = [0, 0.5, 1, ...others.flatMap((o) => [o.x, o.x + o.w, o.x + o.w / 2])];\n  const ys = [0, 0.5, 1, ...others.flatMap((o) => [o.y, o.y + o.h, o.y + o.h / 2])];\n  let best = null;\n  for (const [off, k] of [[0, \"l\"], [r.w / 2, \"c\"], [r.w, \"r\"]]) for (const x of xs) { const d = Math.abs(r.x + off - x); if (d < tx && (!best || d < best.d)) best = { d, v: x - off, g: x }; }\n  if (best) { r.x = best.v; guide(\"x\", best.g); }\n  best = null;\n  for (const [off] of [[0], [r.h / 2], [r.h]]) for (const y of ys) { const d = Math.abs(r.y + off - y); if (d < ty && (!best || d < best.d)) best = { d, v: y - off, g: y }; }\n  if (best) { r.y = best.v; guide(\"y\", best.g); }\n}\nfunction snapEdges(r, others, handle) {\n  const tx = 7 / cssW, ty = 7 / cssH;\n  const xs = [0, 0.5, 1, ...others.flatMap((o) => [o.x, o.x + o.w])];\n  const ys = [0, 0.5, 1, ...others.flatMap((o) => [o.y, o.y + o.h])];\n  if (handle.includes(\"e\")) for (const x of xs) if (Math.abs(r.x + r.w - x) < tx) { r.w = x - r.x; guide(\"x\", x); break; }\n  if (handle.includes(\"w\")) for (const x of xs) if (Math.abs(r.x - x) < tx) { r.w += r.x - x; r.x = x; guide(\"x\", x); break; }\n  if (handle.includes(\"s\")) for (const y of ys) if (Math.abs(r.y + r.h - y) < ty) { r.h = y - r.y; guide(\"y\", y); break; }\n  if (handle.includes(\"n\")) for (const y of ys) if (Math.abs(r.y - y) < ty) { r.h += r.y - y; r.y = y; guide(\"y\", y); break; }\n}\n\nfunction onWheel(e) {\n  const t = currentSlide()?.tiles.find((x) => x.id === app.sel.tile);\n  if (!t || !app.panMode) return;\n  e.preventDefault();\n  beginGesture();\n  t.zoom = clamp(t.zoom * Math.pow(1.1, -e.deltaY / 100), 1, 5);\n  gestureUpdate();\n  clearTimeout(onWheel._t);\n  onWheel._t = setTimeout(endGesture, 400);\n}\n\nfunction tileAt(e) {\n  const s = currentSlide();\n  if (!s) return null;\n  const r = overlay.getBoundingClientRect();\n  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;\n  for (let i = s.tiles.length - 1; i >= 0; i--) {\n    const t = s.tiles[i].rect;\n    if (x >= t.x && x <= t.x + t.w && y >= t.y && y <= t.y + t.h) return s.tiles[i];\n  }\n  return null;\n}\n\nfunction setupDrop() {\n  const zone = stage;\n  const clear = () => overlay.querySelectorAll(\".drop-target\").forEach((b) => b.classList.remove(\"drop-target\"));\n  zone._drop = {\n    accepts: (pl) => pl.type === \"media\" && !app.playing,\n    over(pl, e) {\n      clear();\n      const t = tileAt(e);\n      if (t) overlay.querySelector(`.box[data-id=\"${t.id}\"]`)?.classList.add(\"drop-target\");\n      else zone.classList.add(\"drop-any\");\n    },\n    leave() { clear(); zone.classList.remove(\"drop-any\"); },\n    drop(pl, e) {\n      zone.classList.remove(\"drop-any\");\n      const s = currentSlide();\n      if (!s) { insertSlides(pl.ids.map((id) => slideForMedia([id]))); return; }\n      const target = tileAt(e);\n      const ids = [...pl.ids];\n      change(() => {\n        if (target) {\n          const m = app.mediaById.get(ids[0]);\n          target.mediaId = ids.shift();\n          target.focusX = target.focusY = 0.5;\n          target.zoom = 1;\n          target.trimStart = 0; target.trimEnd = null;\n          target.muted = m?.kind === \"video\" ? s.tiles.length > 1 : true;\n          if (m?.kind === \"video\" && s.tiles.length === 1) s.duration = Math.max(1, Math.round(m.duration * 10) / 10);\n        }\n        for (const t of s.tiles) if (!t.mediaId && ids.length) t.mediaId = ids.shift();\n        let added = 0;\n        while (ids.length && s.tiles.length < 9) {\n          const t = newTile({ x: 0.33 + added * 0.03, y: 0.3 + added * 0.03, w: 0.34, h: 0.4 }, ids.shift());\n          s.tiles.push(t);\n          added++;\n        }\n        if (ids.length) toast(\"Slide is full — the rest weren't added\", \"warn\");\n      });\n    },\n  };\n}\n\nexport function addTextBox() {\n  const s = currentSlide();\n  if (!s) return toast(\"Select a slide first\", \"warn\");\n  const t = newText(\"Double-click to edit\", { size: 64, rect: { x: 0.1, y: 0.75, w: 0.8, h: 0.16 }, bg: \"rgba(0,0,0,0.45)\" });\n  change(() => s.texts.push(t));\n  selectItem(\"text\", t.id);\n  emit(\"focus\", \"text\");\n}\nexport function addPhotoBox() {\n  const s = currentSlide();\n  if (!s) return toast(\"Select a slide first\", \"warn\");\n  const t = newTile({ x: 0.33, y: 0.3, w: 0.34, h: 0.4 });\n  change(() => s.tiles.push(t));\n  selectItem(\"tile\", t.id);\n}\n"},{"name":"zoomspot.js","code":"// Zoom to a spot: pick a START framing and an END framing on the photo (e.g. the whole\n// photo, then a face). The slide glides smoothly from one to the other.\nimport { h, modal, toast, icon } from \"./ui.js\";\nimport { app, change } from \"./state.js\";\nimport { assets } from \"./assets.js\";\nimport { coverScale, placeAt, clamp, easeSine, W0, H0 } from \"./model.js\";\n\nconst MAXZ = 6;\n\nexport async function openZoomSpot(slide, tile) {\n  const m = app.mediaById.get(tile.mediaId);\n  if (!m) return;\n  const img = await loadImage(m);\n  if (!img) return toast(\"The preview of this photo isn't ready yet — try again in a moment.\", \"warn\");\n  const iw = img.naturalWidth, ih = img.naturalHeight;\n  const tw = tile.rect.w * W0, th = tile.rect.h * H0; // box shape (only the ratio matters)\n  const c = coverScale(tile, tw, th, iw, ih);\n  // size of the visible window as a fraction of the image, at zoom z\n  const win = (z) => ({ w: Math.min(1, tw / (c * z * iw)), h: Math.min(1, th / (c * z * ih)) });\n  const clampFrame = (f) => {\n    const z = clamp(f.z, 1, MAXZ), ww = win(z);\n    return { z, x: clamp(f.x, ww.w / 2, 1 - ww.w / 2), y: clamp(f.y, ww.h / 2, 1 - ww.h / 2) };\n  };\n  const full = { x: 0.5, y: 0.5, z: 1 };\n  let from, to;\n  if (tile.motion === \"custom\" && tile.kb) { from = clampFrame(tile.kb.from); to = clampFrame(tile.kb.to); }\n  else { from = clampFrame({ x: tile.focusX, y: tile.focusY, z: 1 }); to = clampFrame({ x: 0.5, y: 0.4, z: 2.5 }); }\n\n  // ---- big picture with two draggable frames\n  const pic = h(\"img\", { class: \"zs-img\", src: img.src, draggable: false });\n  const boxA = h(\"div\", { class: \"zs-box start\" }, h(\"span\", {}, \"START\"), h(\"i\", { class: \"zs-corner\" }));\n  const boxB = h(\"div\", { class: \"zs-box end\" }, h(\"span\", {}, \"END\"), h(\"i\", { class: \"zs-corner\" }));\n  const stage = h(\"div\", { class: \"zs-stage\" }, pic, boxA, boxB);\n  const fitStage = () => {\n    const maxW = 760, maxH = 430, s = Math.min(maxW / iw, maxH / ih);\n    stage.style.width = `${iw * s}px`;\n    stage.style.height = `${ih * s}px`;\n  };\n  const layoutBox = (box, f) => {\n    const ww = win(f.z);\n    Object.assign(box.style, { left: `${(f.x - ww.w / 2) * 100}%`, top: `${(f.y - ww.h / 2) * 100}%`, width: `${ww.w * 100}%`, height: `${ww.h * 100}%` });\n  };\n  const redraw = () => { layoutBox(boxA, from); layoutBox(boxB, to); };\n  const drag = (box, which) => {\n    box.addEventListener(\"pointerdown\", (e) => {\n      e.preventDefault();\n      const r = stage.getBoundingClientRect();\n      const corner = e.target.classList.contains(\"zs-corner\");\n      const f0 = { ...(which === \"a\" ? from : to) };\n      const sx = e.clientX, sy = e.clientY;\n      const move = (ev) => {\n        const dx = (ev.clientX - sx) / r.width, dy = (ev.clientY - sy) / r.height;\n        let f;\n        if (corner) {\n          // drag the corner: bigger box = less zoom\n          const w0 = win(f0.z).w, nw = Math.max(0.03, w0 + dx * 2);\n          f = clampFrame({ ...f0, z: f0.z * (w0 / nw) });\n        } else f = clampFrame({ ...f0, x: f0.x + dx, y: f0.y + dy });\n        if (which === \"a\") from = f; else to = f;\n        redraw();\n      };\n      const up = () => { window.removeEventListener(\"pointermove\", move); window.removeEventListener(\"pointerup\", up); };\n      window.addEventListener(\"pointermove\", move);\n      window.addEventListener(\"pointerup\", up);\n    });\n    box.addEventListener(\"wheel\", (e) => {\n      e.preventDefault();\n      const f = which === \"a\" ? from : to;\n      const nf = clampFrame({ ...f, z: f.z * Math.pow(1.1, -e.deltaY / 100) });\n      if (which === \"a\") from = nf; else to = nf;\n      redraw();\n    }, { passive: false });\n  };\n  drag(boxA, \"a\");\n  drag(boxB, \"b\");\n\n  // ---- live preview of the movement\n  const pw = 320, ph = Math.round(pw * (th / tw));\n  const prev = h(\"canvas\", { class: \"zs-preview\", width: pw, height: Math.min(ph, 400) });\n  let raf = 0, t0 = performance.now();\n  const loopLen = Math.max(2, slide.duration) * 1000;\n  const ani ayBtn;\nlet keepHead = false;\n\nexport function initPlayer(el) {\n  playBtn = h(\"button\", { class: \"play-btn\", title: \"Play / pause (Space)\", onclick: () => toggle() }, icon(\"play\", 17));\n  timeLabel = h(\"span\", { class: \"time\" }, \"0:00 / 0:00\");\n  scrub = h(\"input\", { type: \"range\", class: \"scrub\", min: 0, max: 1, step: 0.01, value: 0 });\n  scrub.addEventListener(\"input\", () => {\n    const t = +scrub.value;\n    if (app.playing) { stop(false); }\n    app.playhead = t;\n    previewStill(t);\n  });\n  el.append(\n    h(\"button\", { class: \"icon-btn\", title: \"Back to start\", onclick: () => { stop(); app.playhead = 0; syncUi(); } }, icon(\"skipBack\", 15)),\n    playBtn,\n    h(\"button\", { class: \"icon-btn\", title: \"Play from the selected slide\", onclick: () => playFromCurrent() }, icon(\"play\", 12), \"This slide\"),\n    scrub, timeLabel);\n  transport = el;\n  on(\"change\", () => { if (!app.playing) syncUi(); });\n  on(\"select\", () => {\n    if (app.playing || keepHead) return;\n    tl = computeTimeline(app.project);\n    const i = currentIndex();\n    if (i >= 0) app.playhead = tl.starts[i];\n    syncUi();\n  });\n  on(\"play-slide\", () => playFromCurrent(true));\n  syncUi();\n}\n\nfunction syncUi() {\n  tl = computeTimeline(app.project);\n  scrub.max = Math.max(0.01, tl.total);\n  scrub.value = Math.min(app.playhead, tl.total);\n  timeLabel.textContent = `${fmtTime(app.playhead)} / ${fmtTime(tl.total)}`;\n  { const st = app.playing ? \"pause\" : \"play\"; if (playBtn.dataset.st !== st) { playBtn.dataset.st = st; setIcon(playBtn, st, \"\", 17); } }\n}\n\nexport function toggle() { app.playing ? stop() : play(app.playhead >= (tl?.total ?? 0) - 0.05 ? 0 : app.playhead); }\nexport function playFromCurrent(onlyThis = false) {\n  tl = computeTimeline(app.project);\n  const i = Math.max(0, currentIndex());\n  play(tl.starts[i] ?? 0, onlyThis ? tl.starts[i] + app.project.slides[i].duration : Infinity);\n}\n\nexport function play(from = 0, until = Infinity) {\n  if (!app.project.slides.length) return;\n  tl = computeTimeline(app.project);\n  env = musicEnvelope(app.project, tl, app.mediaById);\n  sched = musicSchedule(app.project, app.mediaById);\n  t0 = Math.max(0, Math.min(from, tl.total - 0.05));\n  endAt = Math.min(until, tl.total);\n  startPerf = performance.now();\n  app.playing = true;\n  document.body.classList.add(\"is-playing\");\n  emit(\"playing\", true);\n  syncUi();\n  cancelAnimationFrame(raf);\n  raf = requestAnimationFrame(tick);\n}\n\nexport function stop(selectSlideAtPlayhead = true) {\n  if (!app.playing) return;\n  app.playing = false;\n  cancelAnimationFrame(raf);\n  for (const v of videos.values()) { v.pause(); v.removeAttribute(\"src\"); v.load(); }\n  videos.clear();\n  for (const a of audios.values()) a.pause();\n  audios.clear();\n  document.body.classList.remove(\"is-playing\");\n  emit(\"playing\", false);\n  if (selectSlideAtPlayhead) {\n    const spec = frameAt(app.project, tl, app.playhead);\n    if (spec) {\n      const id = app.project.slides[spec.b].id;\n      app.sel.slides = new Set([id]);\n      app.sel.current = id;\n      app.sel.tile = app.sel.text = null;\n      keepHead = true;\n      emit(\"select\");\n      keepHead = false;\n    }\n  }\n  syncUi();\n  requestDraw();\n}\n\nfunction envAt(t) {\n  const x = t * 100, i = Math.floor(x);\n  if (!env || i + 1 >= env.length) return env?.[env.length - 1] ?? 1;\n  const f = x - i;\n  return env[i] * (1 - f) + env[i + 1] * f;\n}\n\nfunction videoKey(slide, tile) { return `${slide.id}:${tile.id}`; }\n\nfunction ensureVideo(slide, tile, lt, playing) {\n  const key = videoKey(slide, tile);\n  const m = app.mediaById.get(tile.mediaId);\n  let v = videos.get(key);\n  const clipEnd = Math.min(tile.trimEnd ?? m.duration, m.duration);\n  const want = tile.trimStart + Math.min(Math.max(0, lt), Math.max(0, clipEnd - tile.trimStart));\n  if (!v) {\n    v = document.createElement(\"video\");\n    v.preload = \"auto\";\n    v.playsInline = true;\n    v.src = assets.videoSrc(m);\n    v.currentTime = want;\n    videos.set(key, v);\n  }\n  v.muted = tile.muted || !m.hasAudio;\n  v.volume = Math.min(1, tile.volume);\n  const pastEnd = lt >= clipEnd - tile.trimStart;\n  if (playing && !pastEnd) {\n    if (v.paused) { v.currentTime = want; v.play().catch(() => {}); }\n    else if (Math.abs(v.currentTime - want) > 0.35) v.currentTime = want;\n  } else if (!v.paused) v.pause();\n  return v;\n}\n\nfunction tick() {\n  if (!app.playing) return;\n  const t = t0 + (performance.now() - startPerf) / 1000;\n  if (t >= endAt) {\n    app.playhead = Math.min(endAt, tl.total);\n    stop();\n    return;\n  }\n  app.playhead = t;\n  const p = app.project;\n  const spec = frameAt(p, tl, t);\n  // manage videos for active (and upcoming) slides\n  const active = new Set();\n  const touch = (si, lt, playing) => {\n    const s = p.slides[si];\n    if (!s) return;\n    for (const tile of s.tiles) {\n      const m = tile.mediaId && app.mediaById.get(tile.mediaId);\n      if (m?.kind === \"video\" && !m.missing) { ensureVideo(s, tile, lt, playing); active.add(videoKey(s, tile)); }\n    }\n  };\n  if (spec) {\n    touch(spec.b, spec.bLt, true);\n    if (spec.a) touch(spec.a[0], spec.a[1], true);\n    const nx = spec.b + 1;\n    if (nx < p.slides.length && tl.starts[nx] - t < 2.5) touch(nx, 0, false); // preload videos\n    for (let j = spec.b + 1; j < Math.min(p.slides.length, spec.b + 3); j++) {\n      for (const tile of p.slides[j].tiles) {\n        const m = tile.mediaId && app.mediaById.get(tile.mediaId);\n        if (m?.kind === \"image\") assets.image(m, \"proxy\"); // warm the image cache\n      }\n    }\n  }\n  for (const [k, v] of videos) if (!active.has(k)) { v.pause(); v.removeAttribute(\"src\"); v.load(); videos.delete(k); }\n\n  // music\n  const s = p.settings, fo = Math.max(s.musicFadeOut, s.endFade, 0.1);\n  for (const it of sched.items) {\n    const local = t - it.start;\n    const on = local >= 0 && local < it.len;\n    let a = audios.get(it.track.id);\n    if (!on || it.media.missing) { if (a && !a.paused) a.pause(); continue; }\n    if (!a) { a = new Audio(assets.audioSrc(it.media)); a.preload = \"auto\"; audios.set(it.track.id, a); }\n    let g = s.musicVolume * it.track.volume;\n    if (it.fadeIn > 0) g *= Math.min(1, local / it.fadeIn);\n    if (it.fadeOut > 0) g *= Math.min(1, (it.len - local) / it.fadeOut);\n    if (t > tl.total - fo) g *= Math.max(0, (tl.total - t) / fo);\n    g *= envAt(t);\n    a.volume = Math.max(0, Math.min(1, g));\n    const want = it.track.trimStart + local;\n    if (a.paused) { a.currentTime = want; a.play().catch(() => {}); }\n    else if (Math.abs(a.currentTime - want) > 0.3) a.currentTime = want;\n  }\n\n  const c = stageCanvas();\n  const ctx = c.getContext(\"2d\");\n  const videoFor = (slide, tile) => videos.get(videoKey(slide, tile));\n  drawFrame(ctx, p, tl, t, c.width, c.height, app.mediaById, videoFor, \"play\");\n  if (spec && spec.b !== tick._last) { tick._last = spec.b; emit(\"playhead\", spec.b); }\n  scrub.value = t;\n  timeLabel.textContent = `${fmtTime(t)} / ${fmtTime(tl.total)}`;\n  raf = requestAnimationFrame(tick);\n}\n\n/** Render a still of the show at time t (used while scrubbing). */\nfunction previewStill(t) {\n  tl = computeTimeline(app.project);\n  const c = stageCanvas();\n  drawFrame(c.getContext(\"2d\"), app.project, tl, t, c.width, c.height, app.mediaById, null, \"play\");\n  timeLabel.textContent = `${fmtTime(t)} / ${fmtTime(tl.total)}`;\n  const spec = frameAt(app.project, tl, t);\n  if (spec) emit(\"playhead\", spec.b);\n  clearTimeout(previewStill._t);\n  previewStill._t = setTimeout(() => {\n    if (app.playing || !spec) return;\n    const id = app.project.slides[spec.b].id;\n    if (app.sel.current !== id) { app.sel.slides = new Set([id]); app.sel.current = id; app.sel.tile = app.sel.text = null; emit(\"select\"); app.playhead = t; syncUi(); }\n  }, 600);\n}\n"},{"name":"autobuild.js","code":"// Auto Build wizard: turns a folder (with optional sub-folders) into a full show.\nimport { h, modal, toast, confirmBox, slider, icon } from \"./ui.js\";\nimport { app, change, addMediaItems, applyStylePreset, emit } from \"./state.js\";\nimport { api } from \"./backend.js\";\nimport { uid, newSlide, newTitleSlide, layoutById, fmtTime, TRANSITION_SETS, STYLE_PRESETS, computeTimeline } from \"./model.js\";\nimport { bestLayout } from \"./layoutfit.js\";\nimport { fitShowTo } from \"./music.js\";\nimport { key } from \"./platform.js\";\n\nfunction mulberry32(a) {\n  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };\n}\nconst MIX = {\n  singles: { label: \"Mostly one photo per slide\", pref: 1.25, max: 2 },\n  balanced: { label: \"Balanced mix (1–4 per slide)\", pref: 2.2, max: 4 },\n  collage: { label: \"Lots of collages (3–6 per slide)\", pref: 3.6, max: 6 },\n};\nconst TR_LEN = { gentle: 1.2, mixed: 1.0, energetic: 0.7 };\nconst TITLE_COLORS = [[\"#1d2b53\", \"#7e2553\"], [\"#0f3d3e\", \"#1b6b5f\"], [\"#3b1f5e\", \"#b0306a\"], [\"#16324f\", \"#2a6f97\"], [\"#4a1c1c\", \"#a8461f\"], [\"#1f2d1f\", \"#567d46\"]];\n\nlet W = null; // wizard state survives between openings in one session\n\nfunction initState() {\n  const year = new Date().getFullYear();\n  return {\n    source: \"folder\", folder: null, groups: [], probing: false,\n    songs: app.project.music.map((t) => app.mediaById.get(t.mediaId)).filter(Boolean),\n    lengthMode: \"music\", customMin: 5,\n    secPerSlide: 4.5, mix: \"balanced\", maxClip: 10, videoSound: false,\n    transitions: \"mixed\", kenBurns: true, style: \"frame\", skipDupes: true,\n    order: \"date\", sectionTitles: true,\n    openTitle: `Our Year ${year}`, openSub: \"\", closeTitle: \"Thanks for an amazing year!\",\n    overflow: \"pick\", underflow: \"longer\", mode: \"replace\", seed: 12345,\n  };\n}\n\nexport async function openAutoBuild() {\n  if (!W) W = initState();\n  if (!W.songs.length) W.songs = app.project.music.map((t) => app.mediaById.get(t.mediaId)).filter(Boolean);\n  const left = h(\"div\", { class: \"ab-left\" });\n  const right = h(\"div\", { class: \"ab-right\" });\n  const rerender = () => { renderLeft(left, rerender); renderSummary(right, rerender); };\n  rerender();\n  const result = await modal({\n    title: h(\"span\", { class: \"ic-lbl\" }, icon(\"sparkles\", 18), \"Auto Build a show\"),\n    wide: \"xl\",\n    body: h(\"div\", { class: \"ab\" }, left, right),\n    buttons: [\n      { label: \"Cancel\", value: null },\n      { label: \"Build my show\", primary: true, value: () => \"build\", validate: async () => {\n        if (W.probing) { toast(\"Still reading the photos — one moment\", \"warn\"); return false; }\n        if (!gatherSections().some((s) => s.items.length)) { toast(\"Choose some photos first\", \"warn\"); return false; }\n        return true;\n      } },\n    ],\n  });\n  if (result === \"build\") await commit();\n}\n\n// ---------------- data gathering\nfunction libraryGroups() {\n  const items = (app.libSel.size ? app.project.media.filter((m) => app.libSel.has(m.id)) : app.project.media).filter((m) => m.kind !== \"audio\");\n  const by = new Map();\n  for (const m of items) { const k = m.folder || \"\"; if (!by.has(k)) by.set(k, []); by.get(k).push(m); }\n  return [...by.entries()].sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }))\n    .map(([k, items]) => ({ key: k, name: k || \"Photos\", include: true, items, photos: items.filter((m) => m.kind === \"image\").length, videos: items.filter((m) => m.kind === \"video\").length }));\n}\n\n// \"01 - Camp\" / \"2. Sports Day\" / \"3_Formal\" → title without the ordering number (the folder name still sets the order)\nfunction cleanTitle(rel) {\n  const one = (seg) => seg.replace(/^\\s*\\d{1,3}\\s*[-._)]*\\s+|^\\s*\\d{1,3}\\s*[-._)]+\\s*/, \"\").trim() || seg;\n  return (rel || \"\").split(/[\\\\/]/).filter(Boolean).map(one).join(\" / \");\n}\n\nasync function chooseFolder(rerender) {\n  const f = await api.pickFolder();\n  if (!f) return;\n  W.folder = f;\n  W.source = \"folder\";\n  W.probing = true;\n  W.groups = [];\n  rerender();\n  try {\n    const groups = (await api.listFolder(f)).filter((g) => g.photos + g.videos > 0);\n    const base = f.split(/[\\\\/]/).filter(Boolean).pop();\n    W.groups = groups.map((g) => ({ key: g.rel, name: cleanTitle(g.rel) || base, include: true, items: [], files: g.files.filter((x) => !/\\.(mp3|wav|m4a|aac|flac|ogg|wma|aiff?|opus)$/i.test(x)), photos: g.photos, videos: g.videos }));\n    // the root folder's own files go first\n    W.groups.sort((a, b) => (a.key === \"\" ? -1 : b.key === \"\" ? 1 : a.key.localeCompare(b.key, undefined, { numeric: true })));\n    rerender();\n    const files = W.groups.flatMap((g) => g.files);\n    const tags = W.groups.flatMap((g) => g.files.map(() => g.key));\n    const res = await api.importFiles(files, tags);\n    const byTag = new Map(W.groups.map((g) => [g.key, g]));\n    for (const it of res.items) { it.id = uid(\"tmp\"); byTag.get(it.folder)?.items.push(it); }\n    for (const g of W.groups) { g.photos = g.items.filter((m) => m.kind === \"image\").length; g.videos = g.items.filter((m) => m.kind === \"video\").length; }\n    if (res.failed.length) toast(`${res.failed.length} file(s) couldn't be read and were skipped`, \"warn\");\n  } catch (e) {\n    toast(`Couldn't read folder: ${e}`, \"error\");\n  }\n  W.probing = false;\n  rerender();\n}\n\nfunction gatherSections() {\n  const groups = W.source === \"library\" ? (W.libGroups ||= libraryGroups()) : W.groups;\n  return groups.filter((g) => g.include).map((g) => {\n    let items = g.items.slice();\n    if (W.order === \"date\") items.sort((a, b) => (a.date || 0) - (b.date || 0) || a.name.localeCompare(b.name, undefined, { numeric: true }));\n    else items.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));\n    let dupes = 0;\n    if (W.skipDupes && W.order === \"date\") {\n      const out = [];\n      let last = null;\n      for (const m of items) {\n        if (m.kind === \"image\" && last && m.date && last.date && Math.abs(m.date - last.date) < 2000) { dupes++; continue; }\n        out.push(m);\n        if (m.kind === \"image\") last = m;\n      }\n      items = out;\n    }\n    return { name: g.name, items, dupes };\n  });\n}\n\nfunction musicTotal() {\n  const cf = app.project.settings.musicCrossfade;\n  const lens = W.songs.map((m) => m.duration || 0).filter((d) => d > 0);\n  return lens.reduce((a, b) => a + b, 0) - Math.max(0, lens.length - 1) * cf;\n}\n\n// ---------------- the planner\nfunction plan() {\n  const sections = gatherSections();\n  const rng = mulberry32(W.seed);\n  const d = W.secPerSlide, tr = TR_LEN[W.transitions], titleDur = 4;\n  const mix = MIX[W.mix];\n  const multi = sections.length > 1;\n  const P = sections.reduce((a, s) => a + s.items.filter((m) => m.kind === \"image\").length, 0);\n  const vids = sections.flatMap((s) => s.items.filter((m) => m.kind === \"video\"));\n  const clip = (v) => Math.max(1, Math.min(v.duration || 1, W.maxClip));\n  const Tv = vids.reduce((a, v) => a + clip(v), 0);\n  const mt = musicTotal();\n  const useMusic = W.lengthMode === \"music\" && mt > 5;\n  const T = useMusic ? mt : W.customMin * 60;\n  const numTitle = (W.openTitle ? 1 : 0) + (W.closeTitle ? 1 : 0) + (multi && W.sectionTitles ? sections.length : 0);\n  const fixedSlides = numTitle + vids.length;\n  const fixedTime = numTitle * titleDur + Tv;\n  const avail = T - fixedTime + Math.max(0, fixedSlides - 1) * tr;\n  const denom = 0.88 * d - tr;\n  const sFor = (n) => (avail - 0.12 * d * n) / denom; // photo slides that fit n photos in avail time\n  let S = P ? sFor(P) : 0;\n  let keep = P, situation = \"ok\", fit = true;\n  const k0 = S > 0 ? P / S : Infinity;\n  const minK = { singles: 1, balanced: 1.6, collage: 3 }[W.mix];\n  const maxSlideDur = Math.max(d * 1.9, 9);\n  if (P && (avail <= d || S < 1 || k0 > mix.max)) {\n    situation = avail <= d ? \"videos\" : \"many\";\n    if (W.overflow === \"pick\" && avail > d) {\n      keep = Math.min(P, Math.max(1, Math.floor((mix.pref * avail) / (denom + mix.pref * 0.12 * d))));\n      S = Math.max(1, Math.round(keep / mix.pref));\n    } else if (W.overflow === \"faster\" && avail > d) {\n      S = Math.max(Math.ceil(P / 9), Math.round(Math.max(1, sFor(P))));\n    } else {\n      S = Math.ceil(P / mix.pref);\n      fit = false;\n    }\n  } else if (P) {\n    // enough time: honour the preferred photos-per-slide, but don't let slides drag on\n    let k = Math.max(k0, minK);\n    S = Math.max(1, Math.round(P / k));\n    const longest = Math.max(1, Math.ceil(avail / (maxSlideDur - tr)));\n    if (S < longest) S = Math.min(P, longest);\n    if (k0 < 1) {\n      situation = \"few\";\n      if (W.underflow === \"shorter\") { fit = false; S = Math.max(1, Math.round(P / Math.max(1, minK))); }\n    }\n  }\n  S = Math.min(S, keep);\n\n  // choose which photos to keep (evenly spread within each section)\n  const photoCount = sections.map((s) => s.items.filter((m) => m.kind === \"image\").length);\n  const quotas = photoCount.map((n) => (P ? Math.round((keep * n) / P) : 0));\n  const secs = sections.map((s, si) => {\n    const photos = s.items.filter((m) => m.kind === \"image\");\n    const q = Math.min(photos.length, quotas[si]);\n    const chosen = new Set();\n    for (let i = 0; i < q; i++) chosen.add(photos[Math.floor(((i + 0.5) * photos.length) / q)]);\n    return { ...s, items: s.items.map((m, ord) => ({ m, ord })).filter((x) => x.m.kind === \"video\" || chosen.has(x.m)) };\n  });\n  const keptP = secs.reduce((a, s) => a + s.items.filter((x) => x.m.kind === \"image\").length, 0);\n\n  // build slides\n  const slides = [];\n  const transSet = TRANSITION_SETS[W.transitions];\n  let lastTr = null;\n  const pickTr = () => {\n    let t;\
