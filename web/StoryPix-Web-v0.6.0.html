<style>:root {
  --bg: #0e1013;
  --panel: #15181d;
  --panel2: #1c1f26;
  --line: #242932;
  --line2: #31373f;
  --text: #e8eaf0;
  --muted: #8b93a5;
  --accent: #ffb547;
  --accent2: #ff8a3d;
  --accent-ink: #1b1204;
  --blue: #5aa9ff;
  --ok: #4ade80;
  --warn: #fbbf24;
  --bad: #f87171;
  --radius: 9px;
  font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 13px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); overflow: hidden;
  display: grid; grid-template-rows: 48px minmax(0, 1fr) 196px; grid-template-columns: minmax(0, 1fr); user-select: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
input[type="text"], input[type="number"], select, textarea {
  background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 8px; min-width: 0;
}
input[type="number"] { width: 72px; }
textarea { width: 100%; resize: vertical; user-select: text; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: -1px; }
input[type="color"] { width: 34px; height: 26px; padding: 0; border: 1px solid var(--line2); border-radius: 6px; background: none; cursor: pointer; }
input[type="range"] { accent-color: var(--accent); min-width: 60px; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.grow { flex: 1; }
.nowrap { white-space: nowrap; }

/* ---------- buttons */
.btn {
  background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 12px; cursor: pointer;
  white-space: nowrap; transition: background .12s, border-color .12s;
}
.btn:hover:not(:disabled) { background: #252a33; border-color: #444c5b; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: #ffc46b; border-color: #ffc46b; }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--panel2); }
.btn.magic { background: linear-gradient(135deg, #7c3aed, #db2777); border: none; color: #fff; font-weight: 600; }
.btn.magic:hover { filter: brightness(1.12); background: linear-gradient(135deg, #7c3aed, #db2777); }
.icon-btn {
  background: transparent; border: 1px solid transparent; border-radius: 6px; width: 28px; height: 28px; cursor: pointer;
  display: inline-grid; place-items: center; color: var(--text); flex: none;
}
.icon-btn:hover:not(:disabled) { background: var(--panel2); border-color: var(--line2); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn.danger:hover { color: var(--bad); }
.icon-btn.playing { color: var(--accent); }
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.btn-row.right { justify-content: flex-end; }
.tog { background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; width: 30px; height: 28px; cursor: pointer; }
.tog.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg button { background: var(--bg); border: none; padding: 4px 10px; cursor: pointer; border-right: 1px solid var(--line2); }
.seg button:last-child { border-right: none; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg.counts button { width: 26px; padding: 4px 0; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0 4px; }
.chip { background: transparent; border: 1px solid var(--line2); border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
.chip.on { background: color-mix(in srgb, var(--accent) 18%, transparent); border-color: var(--accent); color: var(--accent); }

/* ---------- top bar */
#topbar {
  min-width: 0; overflow: hidden;
  display: flex; align-items: center; gap: 4px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 7px; margin-right: 10px; letter-spacing: .2px; }
.logo { color: var(--accent); display: grid; place-items: center; }
.sep { width: 1px; height: 22px; background: var(--line2); margin: 0 6px; display: inline-block; }
.proj-name { background: transparent !important; border-color: transparent !important; font-weight: 600; font-size: 14px; flex: 0 1 240px; width: 240px; min-width: 90px; }
.proj-name:hover { border-color: var(--line2) !important; }
#topbar .btn { margin-left: 4px; }

/* ---------- workspace */
#workspace { display: grid; grid-template-columns: 330px minmax(0, 1fr) 320px; min-height: 0; }
.panel { background: var(--panel); min-height: 0; display: flex; flex-direction: column; }
#left { border-right: 1px solid var(--line); }
#right { border-left: 1px solid var(--line); }
.panel-body { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tab { flex: 1; background: transparent; border: none; padding: 11px 6px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.row.tight { margin: 4px 0; }
.row.wrap { flex-wrap: wrap; }
.row .lbl { color: var(--muted); min-width: 92px; flex: none; }
.row.slider input[type="range"] { flex: 1; }
.row .val { min-width: 44px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.row.check, label.check { gap: 7px; cursor: pointer; display: flex; align-items: center; }
.section { font-size: 12px; letter-spacing: .1px; color: #aab1c0; margin: 16px 0 7px; font-weight: 600; }
h4.sub { margin: 12px 0 4px; font-size: 12px; }
.props-group { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.props-group:last-child { border-bottom: none; }
.props-group.flash { animation: flash .9s; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 25%, transparent); } 100% { background: transparent; } }
.note { background: var(--panel2); border-left: 3px solid var(--blue); padding: 7px 10px; border-radius: 4px; margin: 8px 0; font-size: 12px; line-height: 1.4; }
.note.warn { border-left-color: var(--warn); }
.note.ok { border-left-color: var(--ok); }
.kv { display: flex; justify-content: space-between; padding: 3px 0; }
.kv.big { font-size: 15px; padding: 8px 0; border-top: 1px solid var(--line); margin-top: 4px; }
.kv.sub { color: var(--muted); font-size: 12px; }
.empty { text-align: center; color: var(--muted); padding: 30px 12px; line-height: 1.5; }
.empty .big { font-size: 40px; margin-bottom: 6px; }
.empty.small { padding: 18px 8px; }

/* ---------- library */
.lib-tools { flex: none; }
.lib-grid {
  flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--thumb), 1fr)); gap: 6px;
  align-content: start; grid-auto-rows: max-content; padding: 4px 2px 8px; margin: 0 -4px; min-height: 120px;
}
.lib-folder { grid-column: 1 / -1; font-weight: 600; color: var(--accent); padding: 8px 2px 2px; font-size: 12px; }
.lib-item { position: relative; align-self: start; border-radius: 6px; overflow: hidden; background: #0b0c10; cursor: grab; border: 2px solid transparent; }
.lib-item::before { content: ""; display: block; padding-top: 100%; }
.lib-item:hover { border-color: var(--line2); }
.lib-item.sel { border-color: var(--accent); }
.lib-thumb { position: absolute; inset: 0; display: grid; place-items: center; }
.lib-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.badge { position: absolute; font-size: 10px; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.72); }
.badge.vid { left: 4px; bottom: 4px; }
.badge.used { right: 4px; top: 4px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.sel-bar { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 0 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.sel-bar.hint { color: var(--muted); font-size: 11px; }
.music-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.music-card { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; }
.music-head { display: flex; gap: 8px; align-items: center; }
.music-num { background: var(--accent); color: var(--accent-ink); border-radius: 50%; width: 20px; height: 20px; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
.music-name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.music-ctrls { display: flex; gap: 4px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.mini { display: inline-flex; gap: 4px; align-items: center; font-size: 11px; color: var(--muted); }
.mini input { width: 54px; padding: 2px 4px; }
.music-summary { background: var(--panel2); border-radius: var(--radius); padding: 10px; }
.music-summary .btn { width: 100%; margin-top: 6px; }

/* ---------- centre */
#center { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #0b0c10; }
#stage-tools { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
#stage-wrap { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.stage-canvas { width: 100%; height: 100%; display: block; background: #000; }
.stage-overlay { position: absolute; inset: 0; }
.is-playing .stage-overlay { display: none; }
.stage.drop-any { outline: 3px dashed var(--accent); outline-offset: 4px; }
.stage-banner { display: none; position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: rgba(0,0,0,.8); padding: 6px 12px; border-radius: 999px; font-size: 12px; pointer-events: none; white-space: nowrap; }
.box { position: absolute; cursor: move; transform-origin: center; }
.box:hover { outline: 1px dashed rgba(255,255,255,.55); }
.box.sel { outline: 2px solid var(--accent); }
.box.pan { outline: 2px dashed var(--blue); cursor: grab; }
.box.drop-target { outline: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent); }
.box.text:not(.sel):not(:hover) { outline: 1px dotted rgba(255,255,255,.22); }
.hd { position: absolute; width: 11px; height: 11px; background: #fff; border: 2px solid var(--accent); border-radius: 2px; }
.hd-nw { left: -6px; top: -6px; cursor: nwse-resize; } .hd-ne { right: -6px; top: -6px; cursor: nesw-resize; }
.hd-sw { left: -6px; bottom: -6px; cursor: nesw-resize; } .hd-se { right: -6px; bottom: -6px; cursor: nwse-resize; }
.hd-n { left: calc(50% - 6px); top: -6px; cursor: ns-resize; } .hd-s { left: calc(50% - 6px); bottom: -6px; cursor: ns-resize; }
.hd-e { right: -6px; top: calc(50% - 6px); cursor: ew-resize; } .hd-w { left: -6px; top: calc(50% - 6px); cursor: ew-resize; }
.hd-rot { position: absolute; left: calc(50% - 7px); top: -30px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: grab; }
.hd-rot::after { content: ""; position: absolute; left: 6px; top: 14px; width: 2px; height: 14px; background: var(--accent); }
.guide { position: absolute; background: #ff3cac; pointer-events: none; }
.guide.x { top: 0; bottom: 0; width: 1px; } .guide.y { left: 0; right: 0; height: 1px; }
#transport .icon-btn { width: auto; padding: 0 8px; white-space: nowrap; }
#transport { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--panel); border-top: 1px solid var(--line); }
.play-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--accent); color: var(--accent-ink); font-size: 14px; cursor: pointer; flex: none; }
.scrub { flex: 1; }
.time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 96px; text-align: right; }

/* ---------- props */
.props textarea { margin: 4px 0; }
.slide-head { display: flex; flex-direction: column; gap: 2px; padding-bottom: 4px; }
.media-chip { display: flex; gap: 8px; align-items: center; background: var(--panel2); border-radius: 6px; padding: 6px; }
.media-chip img { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; }
.media-chip .name { font-weight: 600; word-break: break-all; }
.layout-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
.layout-mini { position: relative; aspect-ratio: 16/9; background: var(--bg); border: 2px solid var(--line2); border-radius: 4px; cursor: pointer; }
.layout-mini:hover { border-color: #5a6375; }
.layout-mini.on { border-color: var(--accent); }
.layout-mini i { position: absolute; background: #4b5468; border-radius: 1px; }
.layout-mini.on i { background: color-mix(in srgb, var(--accent) 70%, #333); }
.preset-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.preset { background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
.preset.on { border-color: var(--accent); color: var(--accent); }

/* ---------- storyboard */
#storyboard { min-width: 0; background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.sb-tools { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--line); flex: none; }
.sb-info { color: var(--muted); font-variant-numeric: tabular-nums; }
.sb-strip { min-width: 0; flex: 1; display: flex; align-items: center; gap: 0; overflow-x: auto; overflow-y: hidden; padding: 8px 12px; position: relative; }
.sb-card { flex: none; width: var(--card); background: var(--panel2); border: 2px solid transparent; border-radius: 7px; padding: 4px; cursor: pointer; }
.sb-card:hover { border-color: var(--line2); }
.sb-card.sel { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.sb-card.current { border-color: var(--accent); }
.sb-card.playing { box-shadow: 0 0 0 2px var(--blue); }
.sb-card.drop-into { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 20%, var(--panel2)); }
.sb-thumb canvas { width: 100%; aspect-ratio: 16/9; display: block; border-radius: 4px; background: #000; }
.sb-meta { display: flex; gap: 5px; align-items: center; padding: 3px 2px 0; font-size: 11px; color: var(--muted); }
.sb-num { color: var(--text); font-weight: 600; }
.warn-ic { color: var(--warn); }
.sb-trans { flex: none; width: 24px; text-align: center; color: var(--muted); cursor: pointer; font-size: 13px; padding: 4px 0; border-radius: 4px; }
.sb-trans:hover { color: var(--accent); background: var(--panel2); }
.sb-indicator { display: none; position: absolute; top: 6px; bottom: 6px; width: 3px; background: var(--accent); border-radius: 2px; pointer-events: none; }
.sb-empty { color: var(--muted); padding: 0 20px; }

/* ---------- drag, toast, menus */
body.dragging, body.dragging * { cursor: grabbing !important; }
.drag-ghost { position: fixed; z-index: 1000; pointer-events: none; background: var(--accent); color: var(--accent-ink); padding: 4px 10px; border-radius: 6px; font-weight: 600; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
#toast-root { position: fixed; right: 16px; bottom: 210px; display: flex; flex-direction: column; gap: 8px; z-index: 900; align-items: flex-end; }
.toast, .busy { background: #262b36; border: 1px solid var(--line2); border-left: 4px solid var(--blue); padding: 9px 14px; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.45); max-width: 420px; transition: opacity .4s, transform .4s; }
.toast.ok { border-left-color: var(--ok); } .toast.warn { border-left-color: var(--warn); } .toast.error { border-left-color: var(--bad); }
.toast.out { opacity: 0; transform: translateY(8px); }
.busy { display: flex; gap: 10px; align-items: center; }
.busy.inline { background: transparent; border: none; box-shadow: none; padding: 6px 0; }
.spinner { width: 16px; height: 16px; border: 2px solid var(--line2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.ctx-menu { position: fixed; z-index: 1100; background: #232833; border: 1px solid var(--line2); border-radius: 8px; padding: 4px; min-width: 220px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.ctx-item { padding: 7px 12px; border-radius: 5px; cursor: pointer; }
.ctx-item:hover { background: var(--accent); color: var(--accent-ink); }
.ctx-item.disabled { color: var(--muted); cursor: default; font-size: 11px; }
.ctx-item.disabled:hover { background: none; color: var(--muted); }
.ctx-sep { height: 1px; background: var(--line2); margin: 4px 0; }

/* ---------- modal */
.modal-back { position: fixed; inset: 0; background: rgba(5,6,10,.66); display: grid; place-items: center; z-index: 800; }
.modal { background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; width: min(520px, 94vw); max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.modal.wide { width: min(760px, 95vw); }
.modal.xl { width: min(1180px, 96vw); height: min(860px, 92vh); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font-size: 16px; }
.modal-body { padding: 14px 18px; overflow-y: auto; flex: 1; line-height: 1.45; }
.modal-body p { margin: 6px 0 10px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.form .row .lbl { min-width: 100px; }
.path { font-family: Consolas, monospace; font-size: 12px; word-break: break-all; user-select: text; }
pre.err { white-space: pre-wrap; background: var(--bg); padding: 10px; border-radius: 6px; font-size: 12px; user-select: text; }
.export-progress .phase { font-weight: 600; margin-bottom: 10px; }
.bar { height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
.bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .3s; }
table.keys { border-collapse: collapse; width: 100%; margin: 10px 0; }
table.keys td { padding: 5px 6px; border-bottom: 1px solid var(--line); }
kbd { background: var(--bg); border: 1px solid var(--line2); border-radius: 4px; padding: 1px 6px; font-family: inherit; font-size: 12px; }

/* ---------- auto build */
.ab { display: grid; grid-template-columns: 1fr 340px; gap: 20px; height: 100%; min-height: 0; }
.ab-left { overflow-y: auto; padding-right: 8px; min-height: 0; }
.ab-right { overflow-y: auto; min-height: 0; }
.ab-card { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.ab-card h3 { margin: 0 0 8px; }
h3.step { display: flex; align-items: center; gap: 8px; margin: 18px 0 8px; font-size: 14px; }
h3.step:first-child { margin-top: 0; }
h3.step span { background: var(--accent); color: var(--accent-ink); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; }
.ab .row .lbl { min-width: 130px; }
.radio { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; margin-right: 14px; }
.ab-groups { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.ab-group { display: flex; align-items: center; gap: 6px; background: var(--panel2); padding: 4px 6px; border-radius: 6px; }
.ab-group.off { opacity: .5; }
.ab-order { width: 20px; text-align: center; color: var(--muted); }
.ab-songs { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.ab-song { display: flex; align-items: center; gap: 8px; background: var(--panel2); padding: 4px 8px; border-radius: 6px; }
.ab-opts { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 10px; }
.ab-mode { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }

<script>// StoryPix web backend: replaces the desktop (Tauri + ffmpeg) backend with browser APIs.
(() => {
  "use strict";
  const FS = new Map(), URLS = new Map(), FOLDERS = new Map(), SIG = new Map();
  let seq = 1, cancel = false, lastExport = null;
  const B = {};
  const emit = (e, p) => B.listeners?.[e]?.(p);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const yieldNow = () => new Promise((r) => { const c = new MessageChannel(); c.port1.onmessage = () => r(); c.port2.postMessage(0); });
  const IMG = /\.(jpe?g|jfif|png|webp|gif|bmp|avif|heic|heif)$/i, VID = /\.(mp4|m4v|mov|webm|mkv|avi|wmv|mpe?g|3gp|ogv)$/i, AUD = /\.(mp3|wav|m4a|aac|flac|ogg|wma|aiff?|opus)$/i;
  const kindOf = (n, t = "") => (/^image\//.test(t) || IMG.test(n) ? "image" : /^video\//.test(t) || VID.test(n) ? "video" : /^audio\//.test(t) || AUD.test(n) ? "audio" : null);
  const base = (p) => String(p).split(/[\\/]/).pop();

  function put(file, rel) {
    const sig = `${rel}|${file.size}|${file.lastModified}`;
    let p = SIG.get(sig);
    if (p) return p;
    p = `mem:/${seq++}/${rel}`;
    SIG.set(sig, p);
    FS.set(p, { blob: file, name: file.name });
    return p;
  }
  function putFolder(files) { // files: [{file, relPath}] where relPath = "Folder/sub/a.jpg"
    const bp = `mem:/folder/${seq++}/${files[0].relPath.split("/")[0]}`;
    FOLDERS.set(bp, files.map(({ file, relPath }) => ({ rel: relPath.split("/").slice(1, -1).join("/"), path: put(file, relPath) })));
    return bp;
  }
  function src(p) {
    if (!p) return "";
    let u = URLS.get(p);
    if (u) return u;
    const e = FS.get(p);
    if (!e) return p;
    u = URL.createObjectURL(e.blob);
    URLS.set(p, u);
    return u;
  }
  function download(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 120000);
  }
  function pick({ accept = "", dir = false } = {}) {
    return new Promise((res) => {
      const i = document.createElement("input");
      i.type = "file"; i.accept = accept; i.multiple = true; i.style.display = "none";
      if (dir) i.webkitdirectory = true;
      i.onchange = () => { res([...i.files]); i.remove(); };
      i.oncancel = () => { res([]); i.remove(); };
      document.body.append(i);
      i.click();
    });
  }
  const once = (el, ev, ms = 20000) => new Promise((ok, no) => {
    const t = setTimeout(ok, ms);
    el.addEventListener(ev, () => { clearTimeout(t); ok(); }, { once: true });
    el.addEventListener("error", () => { clearTimeout(t); no(new Error("can't read this file")); }, { once: true });
  });

  // ---------- picking & folders
  B.app_info = () => ({ ffmpeg: true, ffmpegPath: "" });
  B.pick_files = async ({ kind }) => {
    const accept = kind === "audio" ? "audio/*,.mp3,.m4a,.wav,.flac,.ogg,.opus,.aac,.wma,.aif,.aiff" : kind === "project" ? ".storypix,.psproj,.json" : "image/*,video/*,.heic,.heif";
    return (await pick({ accept })).map((f) => put(f, f.name));
  };
  B.pick_folder = async () => {
    const files = await pick({ dir: true });
    return files.length ? putFolder(files.map((f) => ({ file: f, relPath: f.webkitRelativePath || f.name }))) : null;
  };
  B.pick_save = ({ defaultName }) => defaultName;
  B.list_folder = ({ path }) => {
    const g = new Map();
    for (const { rel, path: p } of FOLDERS.get(path) || []) {
      const k = kindOf(base(p), FS.get(p).blob.type);
      if (!k) continue;
      let e = g.get(rel);
      if (!e) g.set(rel, (e = { rel, files: [], photos: 0, videos: 0 }));
      e.files.push(p);
      if (k === "image") e.photos++;
      if (k === "video") e.videos++;
    }
    return [...g.values()];
  };
  B.paths_exist = ({ paths }) => paths.map((p) => FS.has(p));
  B.read_text = async ({ path }) => FS.get(path).blob.text();
  B.write_text = ({ path, content }) => download(new Blob([content], { type: "application/json" }), base(path));
  B.autosave = ({ content }) => { try { localStorage.setItem("storypix.autosave", content); } catch {} };
  B.load_autosave = () => { try { return localStorage.getItem("storypix.autosave"); } catch { return null; } };
  B.clear_autosave = () => { try { localStorage.removeItem("storypix.autosave"); } catch {} };
  B.save_overlay = ({ name }) => `ov:/${name}`;
  B.reveal = () => {};
  B.open_path = () => { if (lastExport) window.open(lastExport.url, "_blank"); };
  B.fileSrc = src;

  // ---------- reading media
  async function exifDate(file) {
    if (!/jpe?g/i.test(file.type) && !/\.jpe?g$/i.test(file.name)) return 0;
    try {
      const d = new DataView(await file.slice(0, 131072).arrayBuffer());
      if (d.getUint16(0) !== 0xffd8) return 0;
      for (let o = 2; o + 4 < d.byteLength;) {
        const m = d.getUint16(o), len = d.getUint16(o + 2);
        if (m === 0xffe1 && d.getUint32(o + 4) === 0x45786966) {
          const t = o + 10, le = d.getUint16(t) === 0x4949;
          const u16 = (x) => d.getUint16(t + x, le), u32 = (x) => d.getUint32(t + x, le);
          const find = (ifd, tag) => { const n = u16(ifd); for (let i = 0; i < n; i++) { const e = ifd + 2 + i * 12; if (u16(e) === tag) return e; } return -1; };
          const ex = find(u32(4), 0x8769);
          let e = ex >= 0 ? find(u32(ex + 8), 0x9003) : -1;
          if (e < 0) e = find(u32(4), 0x0132);
          if (e < 0) return 0;
          const s = String.fromCharCode(...new Uint8Array(d.buffer, t + u32(e + 8), 19)).match(/(\d+):(\d+):(\d+) (\d+):(\d+):(\d+)/);
          return s ? new Date(+s[1], s[2] - 1, +s[3], +s[4], +s[5], +s[6]).getTime() : 0;
        }
        if ((m & 0xff00) !== 0xff00) break;
        o += 2 + len;
      }
    } catch {}
    return 0;
  }
  async function probe(p, folder) {
    const { blob, name } = FS.get(p), kind = kindOf(name, blob.type);
    if (!kind) return null;
    const it = { path: p, name, kind, folder, width: 0, height: 0, duration: 0, date: blob.lastModified || 0, hasAudio: false };
    if (kind === "image") {
      const b = await createImageBitmap(blob);
      it.width = b.width; it.height = b.height; b.close();
      it.date = (await exifDate(blob)) || it.date;
    } else {
      const el = document.createElement(kind);
      el.preload = "metadata"; el.muted = true; el.src = src(p);
      await once(el, "loadedmetadata");
      it.duration = isFinite(el.duration) ? el.duration : 0;
      if (kind === "video") {
        it.width = el.videoWidth; it.height = el.videoHeight;
        it.hasAudio = el.mozHasAudio ?? (el.audioTracks ? el.audioTracks.length > 0 : true);
      }
      el.removeAttribute("src"); el.load();
    }
    return it;
  }
  B.import_files = async ({ files, folders }) => {
    const jobs = [];
    files.forEach((p, i) => {
      if (FOLDERS.has(p)) for (const e of FOLDERS.get(p)) { if (kindOf(base(e.path), FS.get(e.path).blob.type) !== "audio") jobs.push({ p: e.path, folder: e.rel }); }
      else if (FS.has(p)) jobs.push({ p, folder: folders?.[i] ?? "" });
    });
    const out = new Array(jobs.length), failed = [];
    let next = 0;
    await Promise.all(Array.from({ length: 6 }, async () => {
      while (next < jobs.length) {
        const i = next++;
        try { out[i] = await probe(jobs[i].p, jobs[i].folder); if (!out[i]) failed.push(base(jobs[i].p)); } catch { failed.push(base(jobs[i].p)); }
      }
    }));
    return { items: out.filter(Boolean), failed };
  };

  // ---------- preview copies (thumbnails + smaller photos)
  async function shrink(s, max, q) {
    const w = s.videoWidth || s.width, h = s.videoHeight || s.height, k = Math.min(1, max / Math.max(w, h));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
    const x = c.getContext("2d");
    x.imageSmoothingQuality = "high"; x.drawImage(s, 0, 0, c.width, c.height);
    return new Promise((ok, no) => c.toBlob((b) => (b ? ok(b) : no(new Error("couldn't make preview"))), "image/jpeg", q));
  }
  async function makeProxy(m) {
    const ent = FS.get(m.path);
    if (!ent) throw new Error("file missing");
    let thumb, proxy = null;
    if (m.kind === "image") {
      const bmp = await createImageBitmap(ent.blob);
      thumb = await shrink(bmp, 360, 0.8); proxy = await shrink(bmp, 1920, 0.9); bmp.close();
    } else {
      const v = document.createElement("video");
      v.muted = true; v.preload = "auto"; v.src = src(m.path);
      await once(v, "loadeddata");
      v.currentTime = Math.max(0.05, Math.min(1, (v.duration || 1) * 0.1));
      await once(v, "seeked");
      thumb = await shrink(v, 360, 0.8);
      v.removeAttribute("src"); v.load();
    }
    const tp = `cache:/t/${m.id}.jpg`, pp = proxy ? `cache:/p/${m.id}_p.jpg` : null;
    FS.set(tp, { blob: thumb }); if (pp) FS.set(pp, { blob: proxy });
    emit("proxy-ready", { id: m.id, thumb: tp, proxy: pp });
  }
  const queue = []; let running = 0;
  function pump() {
    while (running < 3 && queue.length) {
      const m = queue.shift(); running++;
      makeProxy(m).catch((e) => emit("proxy-ready", { id: m.id, error: String(e?.message || e) })).finally(() => { running--; pump(); });
    }
  }
  B.request_proxies = ({ items }) => { for (const m of items) if (m.kind !== "audio") queue.push(m); pump(); };
  B.cache_info = () => [...FS].reduce((a, [k, v]) => a + (k.startsWith("cache:/") ? v.blob.size : 0), 0);
  B.clear_cache = () => {
    for (const k of [...FS.keys()]) if (k.startsWith("cache:/")) { FS.delete(k); const u = URLS.get(k); if (u) URL.revokeObjectURL(u); URLS.delete(k); }
    return 0;
  };

  // ---------- drag & drop (files and folders)
  async function walk(en, rel, out) {
    if (en.isFile) { out.push({ file: await new Promise((ok, no) => en.file(ok, no)), relPath: rel }); return; }
    const rd = en.createReader();
    for (;;) {
      const ents = await new Promise((ok, no) => rd.readEntries(ok, no));
      if (!ents.length) break;
      for (const c of ents) await walk(c, `${rel}/${c.name}`, out);
    }
  }
  addEventListener("dragover", (e) => { if (e.dataTransfer?.types?.includes("Files")) e.preventDefault(); });
  addEventListener("drop", async (e) => {
    if (!e.dataTransfer?.types?.includes("Files")) return;
    e.preventDefault();
    const entries = [...e.dataTransfer.items].map((i) => i.webkitGetAsEntry?.()).filter(Boolean);
    const paths = [];
    for (const en of entries) {
      if (en.isFile) paths.push(put(await new Promise((ok, no) => en.file(ok, no)), en.name));
      else { const files = []; await walk(en, en.name, files); if (files.length) paths.push(putFolder(files)); }
    }
    emit("tauri://drag-drop", { paths });

let drag = null;\n/** Elements become drop zones by setting el._drop = {accepts(payload), over(payload,e), leave(), drop(payload,e)} */\nexport function beginDrag(e, payload, ghostContent) {\n  const sx = e.clientX, sy = e.clientY;\n  let started = false, ghost = null, lastZone = null;\n  const move = (ev) => {\n    if (!started) {\n      if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;\n      started = true;\n      ghost = h(\"div\", { class: \"drag-ghost\" }, ghostContent());\n      document.body.append(ghost);\n      document.body.classList.add(\"dragging\");\n      drag = payload;\n    }\n    ghost.style.left = `${ev.clientX + 12}px`;\n    ghost.style.top = `${ev.clientY + 12}px`;\n    let el = document.elementFromPoint(ev.clientX, ev.clientY);\n    while (el && !(el._drop && el._drop.accepts(payload))) el = el.parentElement;\n    if (lastZone && lastZone !== el) lastZone._drop.leave?.();\n    lastZone = el;\n    if (el) el._drop.over?.(payload, ev);\n  };\n  const up = (ev) => {\n    window.removeEventListener(\"pointermove\", move);\n    window.removeEventListener(\"pointerup\", up);\n    if (!started) return;\n    ghost?.remove();\n    document.body.classList.remove(\"dragging\");\n    drag = null;\n    if (lastZone) {\n      lastZone._drop.leave?.();\n      lastZone._drop.drop(payload, ev);\n    }\n  };\n  window.addEventListener(\"pointermove\", move);\n  window.addEventListener(\"pointerup\", up);\n}\nexport const isDragging = () => !!drag;\n\nexport function debounce(fn, ms) {\n  let t;\n  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };\n}\n\n/** Labeled slider row helper returning [row, input] */\n/** Parse what someone typed: \"5\", \"5s\", \"80%\", \"1:05.5\", \"-3°\" … */\nexport function parseTyped(text, percent) {\n  const t = String(text).trim().replace(\",\", \".\");\n  if (!t) return NaN;\n  if (t.includes(\":\")) {\n    const parts = t.split(\":\").map((x) => parseFloat(x.replace(/[^0-9.\\-]/g, \"\")));\n    if (parts.some((x) => isNaN(x))) return NaN;\n    return parts.reduce((a, b) => a * 60 + b, 0);\n  }\n  const n = parseFloat(t.replace(/[^0-9.\\-]/g, \"\"));\n  if (isNaN(n)) return NaN;\n  return percent ? n / 100 : n;\n}\n\n/** Slider with a type-in box. Returns the row element. */\nexport function slider({ label, min, max, step = 0.01, value, fmt = (v) => v, oninput, onchange, typedMax, typedMin }) {\n  const percent = String(fmt(1)).includes(\"%\");\n  const box = h(\"input\", { type: \"text\", class: \"val-input\", value: fmt(value), title: \"Type a value and press Enter\" });\n  const inp = h(\"input\", { type: \"range\", min, max, step, value });\n  inp.addEventListener(\"input\", () => { box.value = fmt(+inp.value); oninput?.(+inp.value); });\n  inp.addEventListener(\"change\", () => onchange?.(+inp.value));\n  const commit = () => {\n    let v = parseTyped(box.value, percent);\n    if (isNaN(v)) { box.value = fmt(+inp.value); return; }\n    v = Math.min(typedMax ?? max, Math.max(typedMin ?? min, v));\n    if (step >= 1) v = Math.round(v); else v = Math.round(v * 1000) / 1000;\n    inp.value = v;\n    box.value = fmt(v);\n    oninput?.(v);\n    onchange?.(v);\n  };\n  box.addEventListener(\"focus\", () => box.select());\n  box.addEventListener(\"keydown\", (e) => {\n    if (e.key === \"Enter\") { e.preventDefault(); box.blur(); }\n    if (e.key === \"Escape\") { box.value = fmt(+inp.value); box.blur(); }\n    if (e.key === \"ArrowUp\" || e.key === \"ArrowDown\") {\n      e.preventDefault();\n      const d = (e.key === \"ArrowUp\" ? 1 : -1) * (e.shiftKey ? step * 10 : step);\n      const cur = +inp.value;\n      box.value = fmt(Math.min(typedMax ?? max, Math.max(typedMin ?? min, cur + d)));\n      commit();\n    }\n    e.stopPropagation();\n  });\n  box.addEventListener(\"change\", commit);\n  return h(\"div\", { class: \"row slider\" }, h(\"span\", { class: \"lbl\" }, label), inp, box);\n}\n\n/** A time box (m:ss.s or seconds). value null → shows placehol owspan]]\nconst G = (cols, rows, cells) => ({ cols, rows, cells });\nconst grid = (c, r) => G(c, r, Array.from({ length: c * r }, (_, i) => [i % c, Math.floor(i / c), 1, 1]));\nexport const LAYOUTS = [\n  { id: \"full\", n: 1, name: \"Full screen\", full: true, ...grid(1, 1) },\n  { id: \"framed\", n: 1, name: \"Framed\", margin: 70, ...grid(1, 1) },\n  { id: \"2col\", n: 2, name: \"Side by side\", ...grid(2, 1) },\n  { id: \"2row\", n: 2, name: \"Top & bottom\", ...grid(1, 2) },\n  { id: \"2big\", n: 2, name: \"Big + small\", ...G(3, 1, [[0, 0, 2, 1], [2, 0, 1, 1]]) },\n  { id: \"3col\", n: 3, name: \"Three columns\", ...grid(3, 1) },\n  { id: \"3left\", n: 3, name: \"Big left\", ...G(2, 2, [[0, 0, 1, 2], [1, 0, 1, 1], [1, 1, 1, 1]]) },\n  { id: \"3right\", n: 3, name: \"Big right\", ...G(2, 2, [[0, 0, 1, 1], [0, 1, 1, 1], [1, 0, 1, 2]]) },\n  { id: \"3top\", n: 3, name: \"Two over one\", ...G(2, 2, [[0, 0, 1, 1], [1, 0, 1, 1], [0, 1, 2, 1]]) },\n  { id: \"4grid\", n: 4, name: \"Grid\", ...grid(2, 2) },\n  { id: \"4col\", n: 4, name: \"Four columns\", ...grid(4, 1) },\n  { id: \"4left\", n: 4, name: \"Big left\", ...G(3, 3, [[0, 0, 2, 3], [2, 0, 1, 1], [2, 1, 1, 1], [2, 2, 1, 1]]) },\n  { id: \"4top\", n: 4, name: \"Big top\", ...G(3, 3, [[0, 0, 3, 2], [0, 2, 1, 1], [1, 2, 1, 1], [2, 2, 1, 1]]) },\n  { id: \"5a\", n: 5, name: \"Two over three\", ...G(6, 2, [[0, 0, 3, 1], [3, 0, 3, 1], [0, 1, 2, 1], [2, 1, 2, 1], [4, 1, 2, 1]]) },\n  { id: \"5center\", n: 5, name: \"Big centre\", ...G(4, 2, [[1, 0, 2, 2], [0, 0, 1, 1], [0, 1, 1, 1], [3, 0, 1, 1], [3, 1, 1, 1]]) },\n  { id: \"5left\", n: 5, name: \"Big left\", ...G(4, 2, [[0, 0, 2, 2], [2, 0, 1, 1], [3, 0, 1, 1], [2, 1, 1, 1], [3, 1, 1, 1]]) },\n  { id: \"6grid\", n: 6, name: \"Grid 3×2\", ...grid(3, 2) },\n  { id: \"6left\", n: 6, name: \"Big corner\", ...G(3, 3, [[0, 0, 2, 2], [2, 0, 1, 1], [2, 1, 1, 1], [0, 2, 1, 1], [1, 2, 1, 1], [2, 2, 1, 1]]) },\n  { id: \"6tall\", n: 6, name: \"Grid 2×3\", ...grid(2, 3) },\n  { id: \"7center\", n: 7, name: \"Big centre\", ...G(4, 3, [[1, 0, 2, 2], [0, 0, 1, 1], [0, 1, 1, 1], [3, 0, 1, 1], [3, 1, 1, 1], [0, 2, 2, 1], [2, 2, 2, 1]]) },\n  { id: \"7rows\", n: 7, name: \"Four over three\", ...G(12, 2, [[0, 0, 3, 1], [3, 0, 3, 1], [6, 0, 3, 1], [9, 0, 3, 1], [0, 1, 4, 1], [4, 1, 4, 1], [8, 1, 4, 1]]) },\n  { id: \"8grid\", n: 8, name: \"Grid 4×2\", ...grid(4, 2) },\n  { id: \"8rows\", n: 8, name: \"3 / 2 / 3\", ...G(6, 3, [[0, 0, 2, 1], [2, 0, 2, 1], [4, 0, 2, 1], [0, 1, 3, 1], [3, 1, 3, 1], [0, 2, 2, 1], [2, 2, 2, 1], [4, 2, 2, 1]]) },\n  { id: \"9grid\", n: 9, name: \"Grid 3×3\", ...grid(3, 3) },\n  { id: \"9left\", n: 9, name: \"Big corner\", ...G(4, 3, [[0, 0, 2, 2], [2, 0, 1, 1], [3, 0, 1, 1], [2, 1, 1, 1], [3, 1, 1, 1], [0, 2, 1, 1], [1, 2, 1, 1], [2, 2, 1, 1], [3, 2, 1, 1]]) },\n];\nexport const layoutById = (id) => LAYOUTS.find((l) => l.id === id);\n\nexport function layoutRects(layout, opts = {}) {\n  if (layout.full) return [{ x: 0, y: 0, w: 1, h: 1 }];\n  const m = opts.margin ?? layout.margin ?? 28; // px in 1920x1080 space\n  const g = opts.gap ?? 16;\n  const cw = (W0 - 2 * m - g * (layout.cols - 1)) / layout.cols;\n  const ch = (H0 - 2 * m - g * (layout.rows - 1)) / layout.rows;\n  return layout.cells.map(([c, r, cs, rs]) => {\n    const x = m + c * (cw + g), y = m + r * (ch + g);\n    const w = cs * cw + (cs - 1) * g, h = rs * ch + (rs - 1) * g;\n    return { x: x / W0, y: y / H0, w: w / W0, h: h / H0 };\n  });\n}\nexport const rectAspect = (r) => (r.w * W0) / (r.h * H0);\n\n// ---------- factories\nexport function newTile(rect, mediaId = null) {\n  return {\n    id: uid(\"t\"), rect: { ...rect }, mediaId, fit: \"fill\", focusX: 0.5, focusY: 0.5, zoom: 1,\n    motion: \"none\", motionAmount: 0.15, rotation: 0, trimStart: 0, trimEnd: null, muted: true, volume: 1, kb: null,\n  };\n}\nexport function newSlide(layoutId = \"full\", defaults = {}) {\n  const layout = layoutById(layoutId) || LAYOUTS[0];\n  return {\n    id: uid(\"s\"
