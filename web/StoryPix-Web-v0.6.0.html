k];\n    s.tiles = (s.tiles || []).map((t) => ({ ...newTile(t.rect || { x: 0, y: 0, w: 1, h: 1 }), ...t }));\n    for (const t of s.tiles) if (![\"fill\", \"fit\", \"stretch\"].includes(t.fit)) t.fit = \"fill\";\n    s.texts = (s.texts || []).map((t) => ({ ...newText(), ...t }));\n  }\n  return p;\n}\n\n// ---------- timing (same as Rust)\nexport function effTrans(slides, i) {\n  const s = slides[i];\n  if (s.transition.kind === \"cut\" || s.transition.duration <= 0) return 0;\n  let t = Math.min(s.transition.duration, s.duration / 2);\n  if (i > 0) t = Math.min(t, slides[i - 1].duration / 2);\n  return Math.max(0, t);\n}\nexport function computeTimeline(project) {\n  const sl = project.slides;\n  const starts = [], trans = [];\n  for (let i = 0; i < sl.length; i++) {\n    const tr = effTrans(sl, i);\n    starts.push(i === 0 ? 0 : starts[i - 1] + sl[i - 1].duration - tr);\n    trans.push(tr);\n  }\n  const total = sl.length ? starts[sl.length - 1] + sl[sl.length - 1].duration : 0;\n  return { starts, trans, total };\n}\nexport function frameAt(project, tl, t) {\n  const n = project.slides.length;\n  if (!n) return null;\n  let b = 0;\n  for (let i = 0; i < n; i++) { if (tl.starts[i] <= t + 1e-9) b = i; else break; }\n  const bLt = t - tl.starts[b];\n  const tr = tl.trans[b];\n  const spec = { b, bLt, a: null, inTransition: false, q: 1, endAlpha: 1 };\n  if (tr > 0 && bLt < tr) {\n    spec.inTransition = true;\n    spec.q = Math.min(1, Math.max(0, bLt / tr));\n    if (b > 0) spec.a = [b - 1, t - tl.starts[b - 1]];\n  }\n  const ef = project.settings.endFade;\n  if (ef > 0 && t > tl.total - ef) spec.endAlpha = Math.min(1, Math.max(0, (tl.total - t) / ef));\n  return spec;\n}\nexport const clamp = (v, a, b) => Math.min(b, Math.max(a, v));\nexport const easeSine = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));\nexport const easeCubic = (p) => { p = clamp(p, 0, 1); return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };\n\nexport function motion(tile, p, isVideo) {\n  const fx = tile.focusX, fy = tile.focusY;\n  if (isVideo) return [1, fx, fy];\n  const e = easeSine(p), a = Math.max(0, tile.motionAmount), span = 0.8;\n  switch (tile.motion) {\n    case \"zoomIn\": return [1 + a * e, fx, fy];\n    case \"zoomOut\": return [1 + a * (1 - e), fx, fy];\n    case \"panLeft\": return [1 + a, clamp(fx - (e - 0.5) * span, 0, 1), fy];\n    case \"panRight\": return [1 + a, clamp(fx + (e - 0.5) * span, 0, 1), fy];\n    case \"panUp\": return [1 + a, fx, clamp(fy - (e - 0.5) * span, 0, 1)];\n    case \"panDown\": return [1 + a, fx, clamp(fy + (e - 0.5) * span, 0, 1)];\n    default: return [1, fx, fy];\n  }\n}\n// Keeps the photo's proportions (dw/dh === iw/ih) unless the user chose \"stretch\".\nexport function placeMedia(tile, tw, th, iw, ih, scale, fx, fy) {\n  if (tile.fit === \"stretch\") return [0, 0, tw, th];\n  iw = Math.max(1, iw); ih = Math.max(1, ih);\n  const c = coverScale(tile, tw, th, iw, ih);\n  const s = c * Math.max(0.1, tile.zoom) * scale;\n  const dw = iw * s, dh = ih * s;\n  return [-(dw - tw) * fx, -(dh - th) * fy, dw, dh];\n}\nexport function coverScale(tile, tw, th, iw, ih) {\n  return tile.fit === \"fit\" ? Math.min(tw / iw, th / ih) : Math.max(tw / iw, th / ih);\n}\n/** Put image point (cx, cy) at the box centre at zoom z, without leaving gaps. (mirrors timeline.rs place_at) */\nexport function placeAt(tile, tw, th, iw, ih, z, cx, cy) {\n  if (tile.fit === \"stretch\") return [0, 0, tw, th];\n  iw = Math.max(1, iw); ih = Math.max(1, ih);\n  const s = coverScale(tile, tw, th, iw, ih) * Math.max(0.1, z);\n  const dw = iw * s, dh = ih * s;\n  let left = tw / 2 - cx * dw, top = th / 2 - cy * dh;\n  left = dw >= tw ? clamp(left, tw - dw, 0) : (tw - dw) / 2;\n  top = dh >= th ? clamp(top, th - dh, 0) : (th - dh) / 2;\n  return [left, top, dw, dh];\n}\nexport function customFrame(tile, p) {\n  if (tile.motion !== \"custom\" || !tile.kb) return null;\n  const e = easeSine(p), a = tile.kb.from, b = tile.kb.to;\n  const z0 = Math.max(0.1, a.z), z1 = Math.max(0.1, b.z);\n  return [z0 * Math.pow(z1 / z0, e), a.x + (b.x - a.x) * e, a.y + (b.y - a.y) * e];\n}\n/** Where the media sits in its box. animated=false shows the still/editing view. */\nexport function tileFrame(tile, p, isVideo, tw, th, iw, ih, animated = true) {\n  if (tile.motion === \"custom\" && tile.kb) {\n    const [z, cx, cy] = animated ? customFrame(tile, p) : [tile.kb.from.z, tile.kb.from.x, tile.kb.from.y];\n    return placeAt(tile, tw, th, iw, ih, z, cx, cy);\n  }\n  const [scale, fx, fy] = animated ? motion(tile, p, isVideo) : [1, tile.focusX, tile.focusY];\n  return placeMedia(tile, tw, th, iw, ih, scale, fx, fy);\n}\nexport function textAnim(kind, lt) {\n  if (kind === \"none\") return [1, 0];\n  const a = clamp((lt - 0.3) / 0.8, 0, 1);\n  const ae = 1 - Math.pow(1 - a, 3);\n  return kind === \"rise\" ? [ae, (1 - ae) * 40] : [ae, 0];\n}\nexport function slideHasLiveAudio(project, s, mediaById) {\n  return s.tiles.some((t) => {\n    if (t.muted || t.volume <= 0 || !t.mediaId) return false;\n    const m = mediaById.get(t.mediaId);\n    return m && m.kind === \"video\" && m.hasAudio;\n  });\n}\nexport function musicEnvelope(project, tl, mediaById) {\n  const rate = 100, n = Math.ceil(tl.total * rate) + 1;\n  const ctrl = new Float32Array(n).fill(1);\n  const sl = project.slides, duck = project.settings.duckLevel;\n  const levels = sl.map((s) => {\n    let l = s.musicVolume;\n    if (project.settings.autoDuck && slideHasLiveAudio(project, s, mediaById)) l = Math.min(l, duck);\n    return l;\n  });\n  let b = 0;\n  for (let k = 0; k < n; k++) {\n    const t = k / rate;\n    while (b + 1 < sl.length && tl.starts[b + 1] <= t) b++;\n    if (sl.length) ctrl[k] = levels[b];\n  }\n  const w = 30, pre = new Float64Array(n + 1);\n  for (let i = 0; i < n; i++) pre[i + 1] = pre[i] + ctrl[i];\n  const out = new Float32Array(n);\n  for (let i = 0; i < n; i++) {\n    const lo = Math.max(0, i - w), hi = Math.min(n, i + w + 1);\n    out[i] = (pre[hi] - pre[lo]) / (hi - lo);\n  }\n  return out;\n}\nexport function hash32(i) {\n  let h = i >>> 0;\n  h ^= h >>> 16; h = Math.imul(h, 0x45d9f3b) >>> 0;\n  h ^= h >>> 16; h = Math.imul(h, 0x45d9f3b) >>> 0;\n  h ^= h >>> 16;\n  return (h >>> 0) / 4294967296;\n}\n/** Music playlist placement: [{track, media, start, len, fadeIn, fadeOut}] (mirrors engine audio.rs) */\nexport function musicSchedule(project, mediaById) {\n  const cf = Math.max(0, project.settings.musicCrossfade);\n  const list = project.music.map((t) => ({ t, m: mediaById.get(t.mediaId) })).filter((x) => x.m);\n  const out = [];\n  let pos = 0;\n  for (const { t, m } of list) {\n    const end = Math.min(t.trimEnd ?? m.duration, m.duration);\n    const len = Math.max(0, end - t.trimStart);\n    if (len <= 0.05) continue;\n    const delay = Math.max(0, t.delay || 0);\n    const prev = out[out.length - 1];\n    const cross = !!prev && delay === 0 && cf > 0;\n    const base = cross ? pos - Math.min(cf, len / 2, prev.len / 2) : pos;\n    const start = base + delay;\n    const fadeIn = cross ? pos - base : t.trimStart > 0.3 ? 1 : 0;\n    if (cross) prev.fadeOut = pos - base;\n    out.push({ track: t, media: m, start, base, len, fadeIn, fadeOut: t.trimEnd != null ? 0.5 : 0 });\n    pos = start + len;\n  }\n  return { items: out, total: pos };\n}\nexport function slideKind(project, s, mediaById) {\n  const kinds = s.tiles.map((t) => t.mediaId && mediaById.get(t.mediaId)?.kind).filter(Boolean);\n  return { hasVideo: kinds.includes(\"video\"), photos: kinds.filter((k) => k === \"image\").length, empty: s.tiles.filter((t) => !t.mediaId).length };\n}\nexport function fmtTime(sec, tenths = false) {\n  if (!isFinite(sec) || sec < 0) sec = 0;\n  const m = Math.floor(sec / 60), s = sec - m * 60;\n  return tenths ? `${m}:${s.toFixed(1).padStart(4, \"0\")}` : `${m}:${String(Math.floor(s)).padStart(2, \"0\")}`;\n}\n"},{"name":"backend.js","code":"// Thin wrapper over Tauri commands. In a plain browser (testing) a mock can be\n// provided as window.__MOCK_BACKEND__.\nconst T = window.__TAURI__;\nconst mock = window.__MOCK_BACKEND__;\n\nexport const isTauri = !!T;\n\nexport function invoke(cmd, args = {}) {\n  if (T) return T.core.invoke(cmd, args);\n  if (mock && mock[cmd]) return Promise.resolve(mock[cmd](args));\n  return Promise.reject(new Error(`No backend for ${cmd}`));\n}\n\nexport function listen(evt, fn) {\n  if (T) return T.event.listen(evt, (e) => fn(e.payload));\n  if (mock) (mock.listeners ||= {})[evt] = fn;\n  return Promise.resolve(() => {});\n}\n\nexport function fileSrc(path) {\n  if (!path) return \"\";\n  if (T) return T.core.convertFileSrc(path);\n  return mock?.fileSrc ? mock.fileSrc(path) : path;\n}\n\nexport const api = {\n  info: () => invoke(\"app_info\"),\n  pickFiles: (kind = \"media\") => invoke(\"pick_files\", { kind }),\n  pickFolder: () => invoke(\"pick_folder\"),\n  pickSave: (kind, defaultName) => invoke(\"pick_save\", { kind, defaultName }),\n  listFolder: (path) => invoke(\"list_folder\", { path }),\n  importFiles: (files, folders = null) => invoke(\"import_files\", { files, folders }),\n  requestProxies: (items) => invoke(\"request_proxies\", { items }),\n  pathsExist: (paths, allowNetwork = false) => invoke(\"paths_exist\", { paths, allowNetwork }),\n  writeText: (path, content) => invoke(\"write_text\", { path, content }),\n  readText: (path) => invoke(\"read_text\", { path }),\n  autosave: (content) => invoke(\"autosave\", { content }),\n  loadAutosave: () => invoke(\"load_autosave\"),\n  clearAutosave: () => invoke(\"clear_autosave\"),\n  saveOverlay: (name, b64) => invoke(\"save_overlay\", { name, b64 }),\n  startExport: (req) => invoke(\"start_export\", { req }),\n  cancelExport: () => invoke(\"cancel_export\"),\n  reveal: (path) => invoke(\"reveal\", { path }),\n  openPath: (path) => invoke(\"open_path\", { path }),\n  cacheInfo: () => invoke(\"cache_info\"),\n  clearCache: () => invoke(\"clear_cache\"),\n};\n"},{"name":"assets.js","code":"// Image cache for thumbnails / preview proxies. Calls onLoad listeners so views can redraw.\nimport { fileSrc } from \"./backend.js\";\n\nconst cache = new Map(); // key -> {img, ok}\nconst listeners = new Set();\nlet pending = false;\nconst proxies = new Map(); // mediaId -> {thumb, proxy, error}\n\nfunction notify() {\n  if (pending) return;\n  pending = true;\n  requestAnimationFrame(() => {\n    pending = false;\n    for (const f of listeners) f();\n  });\n}\n\nexport const assets = {\n  onLoad(fn) { listeners.add(fn); },\n  setProxy(id, info) { proxies.set(id, { ...(proxies.get(id) || {}), ...info }); notify(); },\n  proxyInfo(id) { return proxies.get(id); },\n  thumbPath(m) { return proxies.get(m.id)?.thumb || m.thumb || null; },\n  proxyPath(m) { return proxies.get(m.id)?.proxy || m.proxy || null; },\n  /** Video preview src: proxy if ready else original */\n  // Missing / not-approved files are never loaded (that could reach out to a network share).\n  videoSrc(m) { return m.missing ? \"\" : fileSrc(this.proxyPath(m) || m.path); },\n  audioSrc(m) { return m.missing ? \"\" : fileSrc(this.proxyPath(m) || m.path); },\n  /** Returns a loaded HTMLImageElement or null (and starts loading). */\n  image(m, quality = \"proxy\") {\n    let path = null;\n    if (m.kind === \"image\") path = quality === \"thumb\" ? this.thumbPath(m) || this.proxyPath(m) : this.proxyPath(m) || this.thumbPath(m);\n    else if (m.kind === \"video\") path = this.thumbPath(m);\n    if (!path) return null;\n    let e = cache.get(path);\n    if (!e) {\n      const img = new Image();\n      e = { img, ok: false };\n      cache.set(path, e);\n      img.decoding = \"async\";\n      img.onload = () => { e.ok = true; notify(); };\n      img.onerror = () => { e.ok = false; e.failed = true; };\n      img.src = fileSrc(path);\n      if (cache.size > 1500) {\n        for (const [k, v] of cache) { if (k.includes(\"_p.\")) { cache.delete(k); break; } }\n      }\n      // fall back to the thumbnail while the bigger proxy loads\n      if (quality !== \"thumb\" && m.kind === \"image\") {\n        const t = this.thumbPath(m);\n        if (t && t !== path) { const te = cache.get(t); if (te?.ok) return te.img; }\n      }\n      return null;\n    }\n    if (e.ok) return e.img;\n    if (quality !== \"thumb\") {\n      const t = this.thumbPath(m);\n      const te = t && cache.get(t);\n      if (te?.ok) return te.img;\n    }\n    return null;\n  },\n  isReady(m) { return m.kind === \"audio\" || !!this.thumbPath(m); },\n};\n"},{"name":"layoutfit.js","code":"// Picks the layout whose box shapes best match the photos' shapes.\nimport { LAYOUTS, layoutRects, rectAspect } from \"./model.js\";\n\nconst aspectOf = (m) => Math.max(0.2, Math.min(5, (m.width || 4) / (m.height || 3)));\n\nexport function bestLayout(medias, prevLayoutId = null, rng = Math.random) {\n  const n = Math.min(9, Math.max(1, medias.length));\n  const cands = LAYOUTS.filter((l) => l.n === n && !(n === 1 && l.id === \"framed\"));\n  let best = null;\n  for (const l of cands) {\n    const rects = layoutRects(l);\n    const tileOrder = rects.map((r, i) => [Math.log(rectAspect(r)), i]).sort((a, b) => a[0] - b[0]);\n    const medOrder = medias.slice(0, n).map((m, i) => [Math.log(aspectOf(m)), i]).sort((a, b) => a[0] - b[0]);\n    let score = 0;\n    const order = new Array(n);\n    for (let k = 0; k < n; k++) {\n      score += Math.abs(tileOrder[k][0] - medOrder[k][0]);\n      order[tileOrder[k][1]] = medOrder[k][1];\n    }\n    score = score / n + rng() * 0.12 + (l.id === prevLayoutId ? 0.2 : 0);\n    if (!best || score < best.score) best = { layout: l, order, score };\n  }\n  return best;\n}\n"},{"name":"state.js","code":"// Global app state, undo/redo, selection and common project operations.\nimport { defaultProject, normalizeProject, uid, layoutById, layoutRects, newTile, newSlide, STYLE_PRESETS } from \"./model.js\";\nimport { api } from \"./backend.js\";\nimport { assets } from \"./assets.js\";\nimport { bestLayout } from \"./layoutfit.js\";\n\n// Network shares (\\\\server\\share) the user has approved, remembered on this PC.\nconst hostOf = (p) => (/^(\\\\\\\\|\\/\\/)/.test(p || \"\") ? p.replace(/^[\\\\/]+/, \"\").split(/[\\\\/]/)[0].toLowerCase() : null);\nexport const netHosts = {\n  host: hostOf,\n  list() { try { return JSON.parse(localStorage.getItem(\"ps.trustedHosts\") || \"[]\"); } catch { return []; } },\n  trust(hosts) { try { localStorage.setItem(\"ps.trustedHosts\", JSON.stringify([...new Set([...this.list(), ...hosts.filter(Boolean)])])); } catch {} },\n  trusted(p) { const h = hostOf(p); return !h || this.list().includes(h); },\n};\n\nexport const app = {\n  project: defaultProject(),\n  filePath: null,\n  dirty: false,\n  autosaveDirty: false,\n  mediaById: new Map(),\n  sel: { slides: new Set(), current: null, tile: null, text: null },\n  panMode: false,\n  playing: false,\n  playhead: 0,\n  libSel: new Set(),\n};\n\nconst listeners = {};\nexport const on = (evt, fn) => (listeners[evt] ||= []).push(fn);\nexport const emit = (evt, data) => (listeners[evt] || []).forEach((f) => f(data));\n\nconst undoStack = [], redoStack = [];\nconst MAX_UNDO = 100;\n\nexport function reindex() {\n  app.mediaById = new Map(app.project.media.map((m) => [m.id, m]));\n}\nexport function snapshot() {\n  undoStack.push(JSON.stringify(app.project));\n  if (undoStack.length > MAX_UNDO) undoStack.shift();\n  redoStack.length = 0;\n}\nexport function markDirty() {\n  app.dirty = true;\n  app.autosaveDirty = true;\n  emit(\"dirty\");\n}\n/** Apply a change to the project with undo support. */\nexport function change(fn, { undo = true } = {}) {\n  if (undo) snapshot();\n  fn(app.project);\n  reindex();\n  markDirty();\n  fixSelection();\n  emit(\"change\");\n}\nlet gestureOpen = false;\nexport function beginGesture() { if (!gestureOpen) { snapshot(); gestureOpen = true; } }\nexport function gestureUpdate() { markDirty(); emit(\"change\", { light: true }); }\nexport function endGesture() { if (gestureOpen) { gestureOpen = false; emit(\"change\"); } }\n\nexport function undo() {\n  if (!undoStack.length) return;\n  redoStack.push(JSON.stringify(app.project));\n  app.project = JSON.parse(undoStack.pop());\n  reindex(); markDirty(); fixSelection(); emit(\"change\");\n}\nexport function redo() {\n  if (!redoStack.length) return;\n  undoStack.push(JSON.stringify(app.project));\n  app.project = JSON.parse(redoStack.pop());\n  reindex(); markDirty(); fixSelection(); emit(\"change\");\n}\nexport const canUndo = () => undoStack.length > 0;\nexport const canRedo = () => redoStack.length > 0;\n\nexport function setProject(p, filePath = null) {\n  app.project = normalizeProject(p);\n  app.filePath = filePath;\n  undoStack.length = 0; redoStack.length = 0;\n  reindex();\n  // Never trust preview paths stored in a show file; they are regenerated from the cache.\n  for (const m of app.project.media) { m.thumb = null; m.proxy = null; delete m.missing; delete m.error; }\n  app.sel = { slides: new Set(), current: app.project.slides[0]?.id || null, tile: null, text: null };\n  if (app.sel.current) app.sel.slides.add(app.sel.current);\n  app.libSel.clear();\n  app.dirty = false;\n  app.playhead = 0;\n  emit(\"change\");\n  emit(\"select\");\n  emit(\"dirty\");\n}\n\nfunction fixSelection() {\n  const ids = new Set(app.project.slides.map((s) => s.id));\n  for (const id of [...app.sel.slides]) if (!ids.has(id)) app.sel.slides.delete(id);\n  if (!ids.has(app.sel.current)) {\n    app.sel.current = [...app.sel.slides][0] || app.project.slides[0]?.id || null;\n    app.sel.tile = app.sel.text = null;\n  }\n  const s = currentSlide();\n  if (s) {\n    if (app.sel.tile && !s.tiles.some((t) => t.id === app.sel.tile)) app.sel.tile = null;\n    if (app.sel.text && !s.texts.some((t) => t.id === app.sel.text)) app.sel.text = null;\n    if (!app.sel.slides.size) app.sel.slides.add(s.id);\n  }\n  for (const id of [...app.libSel]) if (!app.mediaById.has(id)) app.libSel.delete(id);\n}\n\nexport const currentSlide = () => app.project.slides.find((s) => s.id === app.sel.current) || null;\nexport const currentIndex = () => app.project.slides.findIndex((s) => s.id === app.sel.current);\nexport const currentTile = () => currentSlide()?.tiles.find((t) => t.id === app.sel.tile) || null;\nexport const currentText = () => currentSlide()?.texts.find((t) => t.id === app.sel.text) || null;\nexport const selectedSlides = () => app.project.slides.filter((s) => app.sel.slides.has(s.id));\n\nexport function selectSlide(id, mode = \"single\") {\n  const sl = app.project.slides;\n  if (mode === \"toggle\") {\n    if (app.sel.slides.has(id) && app.sel.slides.size > 1) app.sel.slides.delete(id);\n    else app.sel.slides.add(id);\n  } else if (mode === \"range\" && app.sel.current) {\n    const a = sl.findIndex((s) => s.id === app.sel.current), b = sl.findIndex((s) => s.id === id);\n    app.sel.slides = new Set(sl.slice(Math.min(a, b), Math.max(a, b) + 1).map((s) => s.id));\n  } else app.sel.slides = new Set([id]);\n  if (mode !== \"range\") app.sel.current = id;\n  else if (!app.sel.slides.has(app.sel.current)) app.sel.current = id;\n  app.sel.tile = app.sel.text = null;\n  app.panMode = false;\n  emit(\"select\");\n}\nexport function selectItem(kind, id) {\n  app.sel.tile = kind === \"tile\" ? id : null;\n  app.sel.text = kind === \"text\" ? id : null;\n  if (kind !== \"tile\") app.panMode = false;\n  emit(\"select\");\n}\n\nexport function slideDefaults() {\n  const s = app.project.settings;\n  return { duration: s.defaultDuration, transition: s.defaultTransition, transitionDuration: s.defaultTransitionDuration };\n}\n\n// ---------- media\nexport async function addMediaItems(items) {\n  const byPath = new Map(app.project.media.map((m) => [m.path, m]));\n  netHosts.trust(items.map((it) => hostOf(it.path))); // the user picked these files themselves\n  const added = [], all = [];\n  for (const it of items) {\n    const ex = byPath.get(it.path);\n    if (ex) { all.push(ex); continue; }\n    const m = { ...it, id: uid(\"m\") };\n    byPath.set(m.path, m);\n    added.push(m);\n    all.push(m);\n  }\n  if (added.length) {\n    change((p) => p.media.push(...added), { undo: false });\n    api.requestProxies(added).catch(() => {});\n  }\n  return all;\n}\nexport function mediaUsage() {\n  const u = new Map();\n  for (const s of app.project.slides) for (const t of s.tiles) if (t.mediaId) u.set(t.mediaId, (u.get(t.mediaId) || 0) + 1);\n  for (const t of app.project.music) u.set(t.mediaId, (u.get(t.mediaId) || 0) + 1);\n  return u;\n}\n\n// ---------- slide building helpers\nexport function applyStylePreset(slide, key) {\n  const pr = STYLE_PRESETS[key];\n  if (!pr) return;\n  slide.style = { ...pr.style };\n  slide.stylePreset = key;\n  const multi = slide.tiles.length > 1;\n  const layout = layoutById(slide.layoutId);\n  if (layout && !layout.full) {\n    const rects = layoutRects(layout);\n    slide.tiles.forEach((t, i) => { if (rects[i]) t.rect = { ...rects[i] }; t.rotation = 0; });\n  }\n  if (pr.tilt && multi) {\n    for (const t of slide.tiles) {\n      const sh = 0.9;\n      const cx = t.rect.x + t.rect.w / 2, cy = t.rect.y + t.rect.h / 2;\n      t.rect = { x: cx - (t.rect.w * sh) / 2, y: cy - (t.rect.h * sh) / 2, w: t.rect.w * sh, h: t.rect.h * sh };\n      t.rotation = Math.round((Math.random() * 8 - 4) * 10) / 10;\n    }\n  }\n}\n\n/** Change a slide's layout, keeping media in order. Returns number of media dropped. */\nexport function applyLayout(slide, layoutId) {\n  const layout = layoutById(layoutId);\n  if (!layout) return 0;\n  const rects = layoutRects(layout);\n  const old = slide.tiles;\n  const withMedia = old.filter((t) => t.mediaId);\n  const tiles = rects.map((r, i) => {\n    const src = withMedia[i];\n    if (src) return { ...src, rect: r, rotation: 0, fit: rects.length === 1 ? src.fit : \"fill\" };\n    return newTile(r);\n  });\n  slide.tiles = tiles;\n  slide.layoutId = layoutId;\n  if (rects.length === 1 && tiles[0].mediaId) {\n    const m = app.mediaById.get(tiles[0].mediaId);\n    if (m && m.width < m.height * 1.15 && !layout.margin) tiles[0].fit = \"fit\";\n  }\n  if (slide.stylePreset) applyStylePreset(slide, slide.stylePreset);\n  return Math.max(0, withMedia.length - rects.length);\n}\n\n/** Build a slide for a set of media using the best-matching layout. */\nexport function slideForMedia(mediaIds, opts = {}) {\n  const medias = mediaIds.map((id) => app.mediaById.get(id)).filter(Boolean);\n  const d = slideDefaults();\n  if (medias.length === 1 && medias[0].kind === \"video\") {\n    const m = medias[0];\n    const s = newSlide(\"full\", d);\n    const t = s.tiles[0];\n    t.mediaId = m.id;\n    t.fit = m.width < m.height ? \"fit\" : \"fill\";\n    t.muted = opts.muted ?? false;\n    const maxClip = opts.maxClip ?? 9999;\n    t.trimEnd = m.duration > maxClip ? maxClip : null;\n    s.duration = Math.max(1, Math.round(Math.min(m.duration, maxClip) * 10) / 10);\n    return s;\n  }\n  const { layout, order } = bestLayout(medias, opts.prevLayout, opts.rng);\n  const s = newSlide(layout.id, d);\n  s.tiles.forEach((t, i) => {\n    const m = medias[order[i]];\n    t.mediaId = m.id;\n    if (medias.length === 1 && m.width < m.height * 1.15) t.fit = \"fit\";\n    if (m.kind === \"video\") t.muted = true;\n  });\n  if (medias.length > 1) s.duration = Math.round(d.duration * (1 + 0.12 * (medias.length - 1)) * 10) / 10;\n  return s;\n}\n\nexport function insertSlides(slides, index = null) {\n  change((p) => {\n    const at = index ?? (currentIndex() >= 0 ? currentIndex() + 1 : p.slides.length);\n    p.slides.splice(at, 0, ...slides);\n  });\n  if (slides.length) {\n    app.sel.slides = new Set(slides.map((s) => s.id));\n    app.sel.current = slides[0].id;\n    app.sel.tile = app.sel.text = null;\n    emit(\"select\");\n  }\n}\nexport function deleteSlides(ids) {\n  const set = new Set(ids);\n  let idx = app.project.slides.findIndex((s) => set.has(s.id));\n  change((p) => { p.slides = p.slides.filter((s) => !set.has(s.id)); });\n  const sl = app.project.slides;\n  if (sl.length) selectSlide(sl[Math.min(idx, sl.length - 1)].id);\n  else emit(\"select\");\n}\nexport function duplicateSlides(ids) {\n  const set = new Set(ids);\n  const copies = [];\n  change((p) => {\n    const out = [];\n    for (const s of p.slides) {\n      out.push(s);\n      if (set.has(s.id)) {\n        const c = JSON.parse(JSON.stringify(s));\n        c.id = uid(\"s\");\n        c.tiles.forEach((t) => (t.id = uid(\"t\")));\n        c.texts.forEach((t) => (t.id = uid(\"x\")));\n        out.push(c);\n        copies.push(c);\n      }\n    }\n    p.slides = out;\n  });\n  if (copies.length) { app.sel.slides = new Set(copies.map((c) => c.id)); app.sel.current = copies[0].id; emit(\"select\"); }\n}\n"},{"name":"music.js","code":"// Music tab: soundtrack playlist + audio settings.\nimport { h, toast, slider, timeInput, icon, setIcon } from \"./ui.js\";\nimport { app, change, addMediaItems, beginGesture, gestureUpdate, endGesture, currentIndex } from \"./state.js\";\nimport { api } from \"./backend.js\";\nimport { assets } from \"./assets.js\";\nimport { uid, fmtTime, computeTimeline, musicSchedule, slideKind } from \"./model.js\";\n\nlet previewAudio = null;\n\nexport async function addMusicFiles(paths) {\n  if (!paths?.length) return;\n  const res = await api.importFiles(paths);\n  const items = await addMediaItems(res.items.filter((m) => m.kind === \"audio\"));\n  if (!items.length) { toast(\"No music files found\", \"warn\"); return; }\n  change((p) => { for (const m of items) p.music.push({ id: uid(\"a\"), mediaId: m.id, trimStart: 0, trimEnd: null, volume: 1, delay: 0 }); });\n  toast(`Added ${items.length} song(s)`, \"ok\");\n}\n\n/** Scale photo slide durations so the show length matches `target` seconds. */\nexport function fitShowTo(p, target) {\n  const mb = app.mediaById;\n  const flexible = p.slides.filter((s) => !slideKind(p, s, mb).hasVideo);\n  if (!flexible.length) return false;\n  for (let it = 0; it < 8; it++) {\n    const tl = computeTimeline(p);\n    const flexSum = flexible.reduce((a, s) => a + s.duration, 0);\n    const rest = tl.total - flexSum;\n    const f = (target - rest) / flexSum;\n    if (!isFinite(f) || f <= 0) return false;\n    for (const s of flexible) s.duration = Math.min(20, Math.max(1.5, Math.round(s.duration * f * 100) / 100));\n    if (Math.abs(computeTimeline(p).total - target) < 0.05) break;\n  }\n  return true;\n}\n\nexport function renderMusicPanel(body) {\n  const p = app.project, s = p.settings;\n  const sched = musicSchedule(p, app.mediaById);\n  const showLen = computeTimeline(p).total;\n  const list = h(\"div\", { class: \"music-list\" });\n  p.music.forEach((t, i) => {\n    const m = app.mediaById.get(t.mediaId);\n    if (!m) return;\n    const it = sched.items.find((x) => x.track === t);\n    const len = Math.max(0, Math.min(t.trimEnd ?? m.duration, m.duration) - t.trimStart);\n\n    const move = (d) => change((p) => { const a = p.music; const [x] = a.splice(i, 1); a.splice(Math.max(0, Math.min(a.length, i + d)), 0, x); });\n    list.append(h(\"div\", { class: \"music-card\" },\n      h(\"div\", { class: \"music-head\" },\n        h(\"span\", { class: \"music-num\" }, i + 1),\n        h(\"span\", { class: \"music-name\", title: m.path }, m.name.replace(/\\.[^.]+$/, \"\")),\n        h(\"span\", { class: \"muted\" }, fmtTime(len)),\n        h(\"button\", { class: \"icon-btn\", title: \"Move up\", disabled: i === 0, onclick: () => move(-1) }, icon(\"up\", 14)),\n        h(\"button\", { class: \"icon-btn\", title: \"Move down\", disabled: i === p.music.length - 1, onclick: () => move(1) }, icon(\"down\", 14)),\n        h(\"button\", { class: \"icon-btn danger\", title: \"Remove from show\", onclick: () => change((p) => p.music.splice(i, 1)) }, icon(\"x\", 14))),\n      h(\"div\", { class: \"music-grid\" },\n        h(\"span\", { class: \"muted\" }, \"Skip the first\"),\n        timeInput({ value: t.trimStart, max: Math.max(0, m.duration - 1), title: \"Start the song this far in (skip its intro). Type seconds or m:ss\", onset: (v) => change(() => { t.trimStart = Math.min(v, (t.trimEnd ?? m.duration) - 1); }) }),\n        h(\"button\", { class: \"icon-btn\", title: \"Listen from here\", onclick: (e) => togglePreview(m, t, e.currentTarget) }, icon(\"play\", 14)),\n        h(\"span\", { class: \"muted\" }, \"Stop the song at\"),\n        timeInput({ value: t.trimEnd, allowEmpty: true, placeholder: \"the end\", max: m.duration, title: \"Leave empty to play to the end\", onset: (v) => change(() => { t.trimEnd = v === null || v >= m.duration - 0.05 ? null : Math.max(t.trimStart + 1, v); }) }),\n        h(\"span\", {}),\n        h(\"span\", { class: \"muted\" }, \"Starts in the show at\"),\n        timeInput({ value: it ? it.start : 0, title: \"When this song begins, measured from the start of the show\", onset: (v) => change(() => { t.delay = Math.max(0, Math.round((v - (it ? it.base : 0)) * 10) / 10); }) }),\n        h(\"button\", { class: \"icon-btn\", title: \"Start this song when the selected slide starts\", onclick: () => {\n          const idx = currentIndex();\n          if (idx < 0) return toast(\"Select a slide in the storyboard first\", \"warn\");\n          const at = computeTimeline(p).starts[idx];\n          change(() => { t.delay = Math.max(0, Math.round((at - (it ? it.base : 0)) * 10) / 10); });\n          toast(`Song ${i + 1} now starts with slide ${idx + 1} (${fmtTime(at)})`, \"ok\");\n        } }, icon(\"toStart\", 14))),\n      t.delay > 0 ? h(\"div\", { class: \"muted small\" }, i === 0 ? `Silent for the first ${t.delay}s of the show (videos' own sound still plays).` : `${t.delay}s gap after the previous song.`,\n        \" \", h(\"a\", { href: \"#\", onclick: (e) => { e.preventDefault(); change(() => { t.delay = 0; }); } }, \"Remove\")) : null,\n      slider({ label: \"Volume\", min: 0, max: 1.5, step: 0.05, value: t.volume, fmt: (v) => `${Math.round(v * 100)}%`,\n        oninput: (v) => { beginGesture(); t.volume = v; gestureUpdate(); }, onchange: () => endGesture() })));\n  });\n  if (!p.music.length) list.append(h(\"div\", { class: \"empty small\" }, h(\"div\", { class: \"big\" }, icon(\"music\", 40)), h(\"p\", {}, \"No music yet. Add one or more songs; they play one after another with a smooth crossfade.\")));\n\n  const diff = sched.total - showLen;\n  let status = null;\n  if (p.music.length && p.slides.length) {\n    if (Math.abs(diff) < 1.5) status = h(\"div\", { class: \"note ok has-ic\" }, icon(\"check\", 16), h(\"span\", {}, \"The show and the music finish together.\"));\n    else if (diff > 0) status = h(\"div\", { class: \"note\" }, `Music is ${fmtTime(diff)} longer than the show; it will fade out when the show ends.`);\n    else status = h(\"div\", { class: \"note warn\" }, `The show is ${fmtTime(-diff)} longer than the music, so the end will be silent. Add another song or use \"Fit show to music\".`);\n  }\n  body.append(\n    h(\"div\", { class: \"lib-tools\" },\n      h(\"button\", { class: \"btn primary\", onclick: async () => addMusicFiles(await api.pickFiles(\"audio\")) }, icon(\"plus\", 14), \"Add music\")),\n    list,\n    h(\"div\", { class: \"music-summary\" },\n      h(\"div\", { class: \"kv\" }, h(\"span\", {}, \"Music ends at\"), h(\"b\", {}, fmtTime(sched.total))),\n      h(\"div\", { class: \"kv\" }, h(\"span\", {}, \"Show length\"), h(\"b\", {}, fmtTime(showLen))),\n      status,\n      h(\"button\", { class: \"btn\", disabled: !p.music.length || !p.slides.length, onclick: () => {\n        let ok = false;\n        change((p) => { ok = fitShowTo(p, sched.total); });\n        toast(ok ? `Photo slide timings adjusted so the show runs ${fmtTime(sched.total)}` : \"Couldn't fit — try removing some videos\", ok ? \"ok\" : \"warn\");\n      } }, icon(\"moveH\", 14), \"Fit show to music\")),\n    h(\"h3\", { class: \"section\" }, \"Sound settings\"),\n    h(\"div\", { class: \"props-group\" },\n      slider({ label: \"Music volume\", min: 0, max: 1.5, step: 0.05, value: s.musicVolume, fmt: (v) => `${Math.round(v * 100)}%`, oninput: (v) => { beginGesture(); s.musicVolume = v; gestureUpdate(); }, onchange: endGesture }),\n      slider({ label: \"Song crossfade\", min: 0, max: 6, step: 0.5, value: s.musicCrossfade, fmt: (v) => `${v}s`, oninput: (v) => { beginGesture(); s.musicCrossfade = v; gestureUpdate(); }, onchange: endGesture }),\n      h(\"label\", { class: \"row check\" }, h(\"input\", { type: \"checkbox\", checked: s.autoDuck, onchange: (e) => change(() => { s.autoDuck = e.target.checked; }) }), \"Lower the music when a video's sound is playing\"),\n      slider({ label: \"Lower music to\", min: 0, max: 0.8, step: 0.05, value: s.duckLevel, fmt: (v) => `${Math.round(v * 100)}%`, oninput: (v) => { beginGesture(); s.duckLevel = v; gestureUpdate(); }, onchange: endGesture }),\n      slider({ label: \"Fade out at end\", min: 0, max: 8, step: 0.5, value: s.endFade, fmt: (v) => `${v}s`, oninput: (v) => { beginGesture(); s.endFade = v; gestureUpdate(); }, onchange: endGesture }),\n      h(\"p\", { class: \"muted small\" }, \"You can also lower the music for a single slide in its settings (right panel).\"))\n  );\n}\n\nfunction togglePreview(m, t, btn) {\n  if (previewAudio) {\n    previewAudio.pause();\n    const was = previewAudio._id;\n    previewAudio = null;\n    document.querySelectorAll(\".music-card .icon-btn.playing\").forEach((b) => { b.classList.remove(\"playing\"); setIcon(b, \"play\", \"\", 14); });\n    if (was === t.id) return;\n  }\n  const a = new Audio(assets.audioSrc(m));\n  a._id = t.id;\n  a.currentTime = t.trimStart;\n  a.volume = Math.min(1, t.volume * app.project.settings.musicVolume);\n  a.play().catch(() => toast(\"Can't play this file in preview (it will still export)\", \"warn\"));\n  previewAudio = a;\n  btn.classList.add(\"playing\");\n  setIcon(btn, \"stop\", \"\", 14);\n}\n"},{"name":"library.js","code":"// Left panel: media library (photos & videos) + Music tab.\nimport { h, toast, beginDrag, modal, confirmBox, contextMenu, icon } from \"./ui.js\";\nimport { app, on, emit, change, addMediaItems, mediaUsage, slideForMedia, insertSlides, currentSlide } from \"./state.js\";\nimport { api, fileSrc } from \"./backend.js\";\nimport { assets } from \"./assets.js\";\nimport { fmtTime } from \"./model.js\";\nimport { renderMusicPanel } from \"./music.js\";\nimport { FILE_MANAGER, MOD_NAME } from \"./platform.js\";\n\nlet root, tab = \"media\", filter = \"all\", sort = \"date\", lastClicked = null, thumbSize = 96;\nlet lastSig = \"\";\n\nexport async function importPaths(paths, { silent = false } = {}) {\n  if (!paths?.length) return [];\n  const t = h(\"div\", { class: \"busy\" }, h(\"span\", { class: \"spinner\" }), `Reading ${paths.length > 1 ? paths.length + \" items\" : \"files\"}…`);\n  document.getElementById(\"toast-root\").append(t);\n  try {\n    const res = await api.importFiles(paths);\n    const items = await addMediaItems(res.items);\n    if (res.failed.length) toast(`${res.failed.length} file(s) couldn't be read: ${res.failed.slice(0, 3).join(\", \")}${res.failed.length > 3 ? \"…\" : \"\"}`, \"warn\", 6000);\n    else if (!silent) toast(`Added ${res.items.length} item(s)`, \"ok\");\n    return items;\n  } catch (e) {\n    toast(`Import failed: ${e}`, \"error\", 6000);\n    return [];\n  } finally {\n    t.remove();\n  }\n}\n\nexport function initLibrary(el) {\n  root = el;\n  on(\"change\", (d) => { if (!d?.light) render(); });\n  on(\"libtab\", (t) => { tab = t; lastSig = \"\"; render(); });\n  assets.onLoad(() => updateThumbs());\n  render();\n}\n\nfunction visibleMedia() {\n  const usage = mediaUsage();\n  let list = app.project.media.filter((m) => m.kind !== \"audio\");\n  if (filter === \"image\") list = list.filter((m) => m.kind === \"image\");\n  if (filter === \"video\") list = list.filter((m) => m.kind === \"video\");\n  if (filter === \"unused\") list = list.filter((m) => !usage.get(m.id));\n  const by = {\n    date: (a, b) => (a.date || 0) - (b.date || 0) || a.name.localeCompare(b.name),\n    name: (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }),\n    folder: (a, b) => (a.folder || \"\").localeCompare(b.folder || \"\", undefined, { numeric: true }) || (a.date || 0) - (b.date || 0),\n  }[sort];\n  return { list: list.slice().sort(by), usage };\n}\n\nfunction updateThumbs() {\n  if (tab !== \"media\" || !root) return;\n  root.querySelectorAll(\".lib-item[data-pending]\").forEach((el) => {\n    const m = app.mediaById.get(el.dataset.id);\n    const p = m && assets.thumbPath(m);\n    if (p) {\n      el.removeAttribute(\"data-pending\");\n      el.querySelector(\".lib-thumb\").replaceChildren(h(\"img\", { src: fileSrc(p), loading: \"lazy\", draggable: false }));\n    }\n  });\n}\n\nfunction render() {\n  if (!root) return;\n  const sig = `${tab}|${filter}|${sort}|${thumbSize}|${app.project.media.length}|${[...mediaUsage()].join()}|${app.project.music.map((m) => m.id + m.volume + m.trimStart).join()}|${app.project.slides.length}`;\n  if (sig === lastSig && tab === \"media\") return;\n  lastSig = sig;\n  const prevScroll = root.querySelector(\".lib-grid\")?.scrollTop || 0;\n  const tabs = h(\"div\", { class: \"tabs\" },\n    h(\"button\", { class: `tab ${tab === \"media\" ? \"on\" : \"\"}`, onclick: () => emit(\"libtab\", \"media\") }, icon(\"image\", 15), \"Photos & Videos\"),\n    h(\"button\", { class: `tab ${tab === \"music\" ? \"on\" : \"\"}`, onclick: () => emit(\"libtab\", \"music\") }, icon(\"music\", 15), \"Music\"));\n  const body = h(\"div\", { class: \"panel-body\" });\n  root.replaceChildren(tabs, body);\n  if (tab === \"music\") return renderMusicPanel(body);\n\n  const { list, usage } = visibleMedia();\n  const counts = { image: 0, video: 0 };\n  for (const m of app.project.media) if (counts[m.kind] !== undefined) counts[m.kind]++;\n  const tools = h(\"div\", { class: \"lib-tools\" },\n    h(\"div\", { class: \"btn-row\" },\n      h(\"button\", { class: \"btn primary\", onclick: async () => importPaths(await api.pickFiles(\"media\")) }, icon(\"plus\", 14), \"Add photos / videos\"),\n      h(\"button\", { class: \"btn\", onclick: async () => { const f = await api.pickFolder(); if (f) importPaths([f]); } }, icon(\"plus\", 14), \"Add folder\")),\n    h(\"div\", { class: \"chips\" },\n      [[\"all\", `All ${counts.image + counts.video}`], [\"image\", `Photos ${counts.image}`], [\"video\", `Videos ${counts.video}`], [\"unused\", \"Unused\"]].map(([id, l]) =>\n        h(\"button\", { class: `chip ${filter === id ? \"on\" : \"\"}`, onclick: () => { filter = id; render(); } }, l))),\n    h(\"div\", { class: \"row tight\" },\n      h(\"span\", { class: \"muted\" }, \"Sort\"),\n      h(\"select\", { onchange: (e) => { sort = e.target.value; render(); } },\n        [[\"date\", \"Date taken\"], [\"name\", \"File name\"], [\"folder\", \"Folder\"]].map(([v, l]) => h(\"option\", { value: v, selected: sort === v }, l))),\n      h(\"input\", { type: \"range\", min: 64, max: 180, value: thumbSize, title: \"Thumbnail size\", oninput: (e) => { thumbSize = +e.target.value; grid.style.setProperty(\"--thumb\", `${thumbSize}px`); } })));\n\n  const grid = h(\"div\", { class: \"lib-grid\", style: { \"--thumb\": `${thumbSize}px` } });\n  if (!app.project.media.some((m) => m.kind !== \"audio\")) {\n    grid.append(h(\"div\", { class: \"empty\" },\n      h(\"div\", { class: \"big\" }, icon(\"image\", 40)),\n      h(\"p\", {}, `Add photos and videos with the buttons above, or drag files and folders from ${FILE_MANAGER} straight into this window.`),\n      h(\"p\", { class: \"muted\" }, \"Tip: use Auto Build to turn a whole folder into a show in one go.\")));\n  }\n  let lastFolder = null;\n  for (const m of list) {\n    if (sort === \"folder\" && m.folder !== lastFolder) {\n      lastFolder = m.folder;\n      grid.append(h(\"div\", { class: \"lib-folder\" }, m.folder || \"(top folder)\"));\n    }\n    const tp = assets.thumbPath(m);\n    const n = usage.get(m.id) || 0;\n    const item = h(\"div\", {\n      class: `lib-item ${app.libSel.has(m.id) ? \"sel\" : \"\"}`, \"data-id\": m.id, \"data-pending\": tp ? null : \"1\",\n      title: `${m.name}\\n${m.width}×${m.height}${m.kind === \"video\" ? ` · ${fmtTime(m.duration)}` : \"\"}${m.folder ? `\\nFolder: ${m.folder}` : \"\"}${m.date ? `\\n${new Date(m.date).toISOString().slice(0, 16).replace(\"T\", \" \")}` : \"\"}`,\n    },\n      h(\"div\", { class: \"lib-thumb\" }, tp ? h(\"img\", { src: fileSrc(tp), loading: \"lazy\", draggable: false }) : h(\"span\", { class: \"spinner\" })),\n      m.kind === \"video\" ? h(\"span\", { class: \"badge vid\" }, icon(\"play\", 9), fmtTime(m.duration)) : null,\n      n ? h(\"span\", { class: \"badge used\", title: `Used ${n}×` }, n > 1 ? [icon(\"check\", 10), n] : icon(\"check\", 10)) : null);\n    item.addEventListener(\"pointerdown\", (e) => {\n      if (e.button !== 0) return;\n      const ids = app.libSel.has(m.id) ? list.filter((x) => app.libSel.has(x.id)).map((x) => x.id) : [m.id];\n      beginDrag(e, { type: \"media\", ids }, () => h(\"div\", {}, ids.length > 1 ? `${ids.length} items` : m.name));\n    });\n    item.addEventListener(\"click\", (e) => {\n      if (e.ctrlKey || e.metaKey) app.libSel.has(m.id) ? app.libSel.delete(m.id) : app.libSel.add(m.id);\n      else if (e.shiftKey && lastClicked) {\n        const a = list.findIndex((x) => x.id === lastClicked), b = list.findIndex((x) => x.id === m.id);\n        for (let i = Math.min(a, b); i <= Math.max(a, b); i++) app.libSel.add(list[i].id);\n      } else { app.libSel.clear(); app.libSel.add(m.id); }\n      lastClicked = m.id;\n      refreshSelection(list);\n    });\n    item.addEventListener(\"dblclick\", () => insertSlides([slideForMedia([m.id])]));\n    item.addEventListener(\"contextmenu\", (e) => {\n      e.preventDefault();\n      if (!app.libSel.has(m.id)) { app.libSel.clear(); app.libSel.add(m.id); refreshSelection(list); }\n      contextMenu(e.clientX, e.clientY, [\n        { label: \"Add to show — one per slide\", action: () => addSelected(list, 1) },\n        { label: \"Add to show — as collage(s)…\", action: () => addSelected(list, 0) },\n        true ? null : { label: `Show in ${FILE_MANAGER}`, action: () => api.reveal(m.path) },\n        \"-\",\n        { label: \"Remove from library\", action: () => removeSelected() },\n      ]);\n    });\n    grid.append(item);\n  }\n  const selBar = makeSelBar(list);\n  body.append(tools, grid, selBar);\n  grid.scrollTop = prevScroll;\n}\n\nfunction refreshSelection(list) {\n  root.querySelectorAll(\".lib-item\").forEach((el) => el.classList.toggle(\"sel\", app.libSel.has(el.dataset.id)));\n  const old = root.querySelector(\".sel-bar\");\n  if (old) old.replaceWith(makeSelBar(list));\n  lastSig = \"\";\n}\n\nfunction makeSelBar(list) {\n  return app.libSel.size\n    ? h(\"div\", { class: \"sel-bar\" },\n      h(\"span\", {}, `${app.libSel.size} selected`),\n      h(\"button\", { class: \"btn small primary\", onclick: () => addSelected(list, 1) }, \"Add as slides\"),\n      h(\"button\", { class: \"btn small\", onclick: () => addSelected(list, 0) }, \"Add as collage\"),\n      h(\"button\", { class: \"btn small ghost\", title: \"Clear selection\", onclick: () => { app.libSel.clear(); refreshSelection(list); } }, icon(\"x\", 14)))\n    : h(\"div\", { class: \"sel-bar hint\" }, `Click to select · ${MOD_NAME}/Shift for many · drag onto a slide or the storyboard`);\n}\n\nasync function addSelected(list, perSlide) {\n  const ids = list.filter((m) => app.libSel.has(m.id)).map((m) => m.id);\n  if (!ids.length) return;\n  if (!perSlide) {\n    const sel = h(\"select\", {}, [2, 3, 4, 5, 6, 7, 8, 9].map((n) => h(\"option\", { value: n, selected: n === Math.min(4, Math.max(2, ids.length)) }, `${n} per slide`)));\n    const v = await modal({ title: \"Add as collage\", body: h(\"div\", {}, h(\"p\", {}, `${ids.length} item(s) will be grouped into collage slides. Videos always get their own slide.`), sel), buttons: [{ label: \"Cancel\", value: null }, { label: \"Add\", value: () => +sel.value, primary: true }] });\n    if (!v) return;\n    perSlide = v;\n  }\n  const slides = [];\n  let group = [], prev = null;\n  const flush = () => { if (group.length) { const s = slideForMedia(group, { prevLayout: prev }); prev = s.layoutId; slides.push(s); group = []; } };\n  for (const id of ids) {\n    const m = app.mediaById.get(id);\n    if (m.kind === \"video\") { flush(); slides.push(slideForMedia([id])); continue; }\n    group.push(id);\n    if (group.length >= perSlide) flush();\n  }\n  flush();\n  insertSlides(slides);\n  app.libSel.clear();\n  toast(`Added ${slides.length} slide(s)`, \"ok\");\n}\n\nasync function removeSelected() {\n  const ids = new Set(app.libSel);\n  const usage = mediaUsage();\n  const used = [...ids].filter((id) => usage.get(id)).length;\n  if (used && !(await confirmBox(\"Remove from library\", `${used} of these are used in the show. They'll be removed from their slides too.`, \"Remove\", true))) return;\n  change((p) => {\n    p.media = p.media.filter((m) => !ids.has(m.id));\n    for (const s of p.slides) for (const t of s.tiles) if (ids.has(t.mediaId)) t.mediaId = null;\n    p.music = p.music.filter((t) => !ids.has(t.mediaId));\n  });\n  app.libSel.clear();\n}\n\nexport function refreshLibrary() { lastSig = \"\"; render(); }\nexport { currentSlide };\n"},{"name":"render.js","code":"// Canvas renderer for editor, thumbnails and preview. Mirrors engine/src/render.rs.\nimport { textAnim, frameAt, easeCubic, hash32, clamp, tileFrame } from \"./model.js\";\nimport { assets } from \"./assets.js\";\nimport { FONT_FALLBACK } from \"./platform.js\";\n\nfunction roundRectPath(ctx, w, h, r) {\n  r = Math.max(0, Math.min(r, w / 2, h / 2));\n  ctx.beginPath();\n  if (r < 0.5) ctx.rect(0, 0, w, h);\n  else ctx.roundRect(0, 0, w, h, r);\n}\n\nfunction tileTransform(ctx, g, rot, dx = 0, dy = 0) {\n  ctx.translate(g.x + g.w / 2 + dx, g.y + g.h / 2 + dy);\n  ctx.rotate((rot * Math.PI) / 180);\n  ctx.translate(-g.w / 2, -g.h / 2);\n}\n\nconst bgCache = new Map();\nfunction blurredBackground(img, key, W, H) {\n  const k = `${key}|${W}x${H}`;\n  let c = bgCache.get(k);\n  if (c) return c;\n  c = document.createElement(\"canvas\");\n  c.width = Math.max(32, Math.round(W / 4));\n  c.height = Math.max(18, Math.round(H / 4));\n  const x = c.getContext(\"2d\");\n  const iw = img.videoWidth || img.naturalWidth || img.width, ih = img.videoHeight || img.naturalHeight || img.height;\n  const s = Math.max(c.width / iw, c.height / ih) * 1.15;\n  x.filter = `blur(${Math.max(2, c.width / 45)}px)`;\n  x.drawImage(img, (c.width - iw * s) / 2, (c.height - ih * s) / 2, iw * s, ih * s);\n  x.filter = \"none\";\n  x.fillStyle = \"rgba(0,0,0,0.35)\";\n  x.fillRect(0, 0, c.width, c.height);\n  if (bgCache.size > 300) bgCache.delete(bgCache.keys().next().value);\n  bgCache.set(k, c);\n  return c;\n}\n\nexport function drawBackground(ctx, slide, W, H, mode, mediaById) {\n  const bg = slide.background;\n  if (bg.kind === \"gradient\") {\n    const g = ctx.createLinearGradient(0, 0, W, H);\n    g.addColorStop(0, bg.color);\n    g.addColorStop(1, bg.color2);\n    ctx.fillStyle = g;\n    ctx.fillRect(0, 0, W, H);\n    return;\n  }\n  if (bg.kind === \"blur\") {\n    ctx.fillStyle = \"#000\";\n    ctx.fillRect(0, 0, W, H);\n    const t = slide.tiles.find((t) => t.mediaId && mediaById.get(t.mediaId));\n    if (!t) return;\n    const m = mediaById.get(t.mediaId);\n    const img = assets.image(m, \"thumb\");\n    if (img) ctx.drawImage(blurredBackground(img, m.id, W, H), 0, 0, W, H);\n    return;\n  }\n  ctx.fillStyle = bg.color || \"#000\";\n  ctx.fillRect(0, 0, W, H);\n}\n\n/**\n * Draw one slide.\n * mode: \"edit\" (static, placeholders), \"thumb\" (static, small), \"play\" (animated, live video)\n */\nexport function drawSlide(ctx, project, slide, lt, W, H, mode, mediaById, videoFor) {\n  const k = H / 1080;\n  ctx.save();\n  drawBackground(ctx, slide, W, H, mode, mediaById);\n  const animated = mode === \"play\";\n  const p = slide.duration > 0 ? clamp(lt / slide.duration, 0, 1) : 0;\n  const st = slide.style;\n  for (const tile of slide.tiles) {\n    const g = { x: tile.rect.x * W, y: tile.rect.y * H, w: tile.rect.w * W, h: tile.rect.h * H };\n    if (g.w < 1 || g.h < 1) continue;\n    const m = tile.mediaId ? mediaById.get(tile.mediaId) : null;\n    if (!m) {\n      if (mode !== \"play\") {\n        ctx.save();\n        tileTransform(ctx, g, tile.rotation);\n        roundRectPath(ctx, g.w, g.h, st.radius * k);\n        ctx.fillStyle = \"rgba(255,255,255,0.07)\";\n        ctx.fill();\n        ctx.setLineDash([8 * k * 1.5, 6 * k * 1.5]);\n        ctx.lineWidth = Math.max(1, 2 * k * 1.5);\n        ctx.strokeStyle = \"rgba(255,255,255,0.45)\";\n        ctx.stroke();\n        if (mode === \"edit\") {\n          ctx.fillStyle = \"rgba(255,255,255,0.6)\";\n          ctx.font = `${Math.max(10, Math.min(g.w, g.h) * 0.09)}px ${FONT_FALLBACK}`;\n          ctx.textAlign = \"center\";\n          ctx.textBaseline = \"middle\";\n          ctx.fillText(\"Drop a photo or video here\", g.w / 2, g.h / 2);\n        }\n        ctx.restore();\n      }\n      continue;\n    }\n    const isVideo = m.kind === \"video\";\n    if (st.shadow) {\n      for (const [dx, dy, a] of [[1, 3, 40], [3, 7, 30], [6, 12, 22]]) {\n        ctx.save();\n        tileTransform(ctx, g, tile.rotation, dx * k, dy * k);\n        roundRectPath(ctx, g.w, g.h, st.radius * k);\n        ctx.fillStyle = `rgba(0,0,0,${a / 255})`;\n        ctx.fill();\n        ctx.restore();\n      }\n    }\n    ctx.save();\n    tileTransform(ctx, g, tile.rotation);\n    roundRectPath(ctx, g.w, g.h, st.radius * k);\n    ctx.save();\n    ctx.clip();\n    let src = null;\n    if (isVideo && animated && videoFor) {\n      const v = videoFor(slide, tile);\n      if (v & "},{"name":"trim.js","code":"// Video trimmer: watch the clip, drag the yellow handles (or type times) to keep just the part you want.\nimport { h, modal, timeInput, fmtSecs, toast, icon, setIcon } from \"./ui.js\";\nimport { app, change } from \"./state.js\";\nimport { assets } from \"./assets.js\";\n\nexport async function openTrim(slide, tile) {\n  const m = app.mediaById.get(tile.mediaId);\n  if (!m || m.kind !== \"video\") return;\n  if (m.missing) { toast(\"This video can't be found, so it can't be trimmed.\", \"warn\"); return; }\n  const dur = Math.max(0.1, m.duration);\n  let start = tile.trimStart || 0;\n  let end = Math.min(tile.trimEnd ?? dur, dur);\n  const onlyTile = slide.tiles.filter((t) => t.mediaId).length === 1;\n\n  const video = h(\"video\", { class: \"trim-video\", preload: \"auto\", playsInline: true });\n  video.src = assets.videoSrc(m);\n  video.muted = false;\n  const strip = h(\"canvas\", { class: \"trim-strip\", width: 1200, height: 80 });\n  const sel = h(\"div\", { class: \"trim-sel\" });\n  const hIn = h(\"div\", { class: \"trim-handle in\", title: \"Drag to set where the clip starts\" });\n  const hOut = h(\"div\", { class: \"trim-handle out\", title: \"Drag to set where the clip ends\" });\n  const head = h(\"div\", { class: \"trim-head\" });\n  const bar = h(\"div\", { class: \"trim-bar\" }, strip, h(\"div\", { class: \"trim-shade left\" }), h(\"div\", { class: \"trim-shade right\" }), sel, hIn, hOut, head);\n  const now = h(\"span\", { class: \"trim-now\" }, \"0:00.0\");\n  const lenLbl = h(\"b\", {}, \"\");\n  let startBox, endBox;\n  const playBtn = h(\"button\", { class: \"btn\", onclick: () => togglePlay() }, icon(\"play\", 13), \"Play clip\");\n  const fitChk = h(\"input\", { type: \"checkbox\", checked: onlyTile });\n  const muteChk = h(\"input\", { type: \"checkbox\", checked: !!tile.muted });\n\n  const pct = (t) => `${(t / dur) * 100}%`;\n  function update() {\n    sel.style.left = pct(start); sel.style.width = pct(end - s
