[package]
name = "storypix"
version = "0.5.0"
edition = "2021"
description = "StoryPix - photo & video slideshow maker"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
rayon = "1"
anyhow = "1"
base64 = "0.22"
storypix-engine = { path = "../engine" }
