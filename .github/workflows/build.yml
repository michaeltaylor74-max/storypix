name: Build StoryPix

# Pushes to main build a test installer (downloadable from the run's "Artifacts").
# Pushing a version tag such as v0.3.0 builds AND publishes a public release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version number (e.g. 0.3.0). Leave empty to just build."
        required: false
        default: ""

# Least privilege: nothing in the build can write to the repository.
permissions:
  contents: read

env:
  # Every outside download is pinned to an exact version / fingerprint.
  FFMPEG_VERSION: "9.0.2"
  FFMPEG_SHA256: "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba"
  TAURI_CLI_VERSION: "2.12.4"
  # Mac: ffmpeg is built from source at these exact commits (see .github/scripts/build-ffmpeg-macos.sh)
  MAC_FFMPEG_COMMIT: "946fcce07b6dcd0331c8cc609192aeff5e1924f8" # FFmpeg n9.0.2
  MAC_X264_COMMIT: "31e19f92f00c7003fa115047ce50978bc98c3a0d"   # x264 stable
  MAC_NASM_COMMIT: "cd37b81b320ead83ca5a6bbce5da0a6456663bc6"   # nasm 2.16.03

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Download and verify ffmpeg (video engine)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = $env:FFMPEG_VERSION
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$v/ffmpeg-$v-essentials_build.zip" -OutFile ffmpeg.zip
          $hash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) { throw "ffmpeg download does not match the expected fingerprint ($hash). Stopping." }
          Write-Host "ffmpeg $v verified: $hash"
          Expand-Archive ffmpeg.zip -DestinationPath ffx
          $root = "ffx/ffmpeg-$v-essentials_build"
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item "$root/bin/ffmpeg.exe" src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          Copy-Item "$root/bin/ffprobe.exe" src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe
          Copy-Item "$root/LICENSE" FFMPEG-LICENSE.txt

      - name: Build app + installer
        working-directory: src-tauri
        run: npx --yes "@tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}" build -- --locked

      - name: Package files and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist, portable/StoryPix | Out-Null
          Copy-Item target/release/storypix.exe portable/StoryPix/StoryPix.exe
          Copy-Item src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe portable/StoryPix/ffmpeg.exe
          Copy-Item src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe portable/StoryPix/ffprobe.exe
          Copy-Item FFMPEG-LICENSE.txt, THIRD-PARTY-NOTICES.md, LICENSE portable/StoryPix/
          Compress-Archive -Path portable/StoryPix -DestinationPath dist/StoryPix-portable.zip
          $inst = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $inst.FullName dist/StoryPix-Setup.exe
          Get-ChildItem dist | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: StoryPix-windows
          path: dist/*

      # Microsoft Store package. Uploaded to Partner Center by hand; Microsoft signs it.
      # (Not attached to releases: unsigned MSIX files can't be installed by normal users.)
      - name: Build Microsoft Store package (MSIX)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version + ".0"
          $L = "msix-layout"
          New-Item -ItemType Directory -Force $L, "$L/Assets", store | Out-Null
          Copy-Item target/release/storypix.exe "$L/StoryPix.exe"
          Copy-Item src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe "$L/ffmpeg.exe"
          Copy-Item src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe "$L/ffprobe.exe"
          Copy-Item FFMPEG-LICENSE.txt, THIRD-PARTY-NOTICES.md, LICENSE $L
          Copy-Item packaging/msix/Assets/* "$L/Assets"
          (Get-Content packaging/msix/AppxManifest.template.xml -Raw).Replace("__VERSION__", $ver) | Set-Content "$L/AppxManifest.xml" -Encoding utf8
          $bin = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          & "$($bin.FullName)\makeappx.exe" pack /d $L /p "store/StoryPix-$ver-store.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          "SDK_BIN=$($bin.FullName)" | Out-File $env:GITHUB_ENV -Append
          Get-ChildItem store

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: StoryPix-microsoft-store
          path: store/*.msix

      - name: Test-install the Store package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          trap { $m = ($_ | Out-String) -replace "%","%25" -replace "`r","" -replace "`n","%0A"; Write-Host "::error title=Store package test failed::$m"; break }
          # A throw-away certificate, only so Windows will install the package on this build machine.
          $pub = ([xml](Get-Content msix-layout/AppxManifest.xml)).Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type Custom -Subject $pub -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String ([guid]::NewGuid().ToString()) -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath test.pfx -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath test.cer | Out-Null
          Import-Certificate -FilePath test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $msix = Get-ChildItem store/*.msix | Select-Object -First 1
          Copy-Item $msix.FullName test.msix
          & "$env:SDK_BIN\signtool.exe" sign /fd SHA256 /f test.pfx /p ([Runtime.InteropServices.Marshal]::PtrToStringAuto([Runtime.InteropServices.Marshal]::SecureStringToBSTR($pw))) test.msix
          if ($LASTEXITCODE -ne 0) { throw "test signing failed" }
          Add-AppxPackage -Path test.msix
          $pkg = Get-AppxPackage -Name "TaylorMadeApps.StoryPix"
          if (-not $pkg) { throw "package did not install" }
          Write-Host "Installed $($pkg.PackageFullName)"
          if (-not (Test-Path (Join-Path $pkg.InstallLocation "ffmpeg.exe"))) { throw "ffmpeg.exe missing from package" }
          & (Join-Path $pkg.InstallLocation "ffmpeg.exe") -hide_banner -version | Select-Object -First 1
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!StoryPix"
          Start-Sleep -Seconds 20
          $p = Get-Process -Name StoryPix -ErrorAction SilentlyContinue
          if ($p) { Write-Host "StoryPix started from the package and kept running"; $p | Stop-Process -Force }
          else { Write-Host "::warning title=Store package::StoryPix installed but did not stay running on the build machine (may be the build machine's desktop); check by hand" }
          Remove-AppxPackage -Package $pkg.PackageFullName


  build-mac:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain (Apple Silicon + Intel)
        run: rustup toolchain install 1.97.0 --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Releases always build ffmpeg fresh from the pinned sources; ordinary builds reuse it.
      - name: Restore ffmpeg build
        id: ffcache
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')) }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ffmpeg-mac
          key: ffmpeg-mac-${{ env.MAC_FFMPEG_COMMIT }}-${{ env.MAC_X264_COMMIT }}-${{ env.MAC_NASM_COMMIT }}-${{ hashFiles('.github/scripts/build-ffmpeg-macos.sh') }}

      - name: Build ffmpeg from source (first time only, ~30 min)
        if: steps.ffcache.outputs.cache-hit != 'true'
        env:
          FFMPEG_COMMIT: ${{ env.MAC_FFMPEG_COMMIT }}
          X264_COMMIT: ${{ env.MAC_X264_COMMIT }}
          NASM_COMMIT: ${{ env.MAC_NASM_COMMIT }}
        run: |
          # build helpers only (nothing from these ends up in the app)
          for t in pkgconf autoconf automake; do brew list "$t" >/dev/null 2>&1 || brew install "$t"; done
          set +e
          .github/scripts/build-ffmpeg-macos.sh ffmpeg-mac 2>&1 | tee ffbuild.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # surface the end of the log as an annotation (easy to read from the run summary)
            { grep -E -i -B2 'error|not found|undefined|failed' ffbuild.log | grep -v -E '^\+|Wno-error|-Werror' | tail -n 25; echo ===; tail -n 8 ffbuild.log; } | cut -c1-220 \
              | perl -pe 's/%/%25/g; s/\r//g; s/\n/%0A/g' | { printf '::error title=ffmpeg build failed::'; cat; echo; }
            exit "$rc"
          fi

      - name: Save ffmpeg build (so later runs skip it)
        if: steps.ffcache.outcome == 'success' && steps.ffcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ffmpeg-mac
          key: ${{ steps.ffcache.outputs.cache-primary-key }}

      - name: Add ffmpeg to the app
        run: |
          mkdir -p src-tauri/binaries
          # Tauri looks for one copy per chip type while building, plus the joined one
          for t in universal aarch64 x86_64; do
            cp ffmpeg-mac/ffmpeg  src-tauri/binaries/ffmpeg-$t-apple-darwin
            cp ffmpeg-mac/ffprobe src-tauri/binaries/ffprobe-$t-apple-darwin
          done
          cp ffmpeg-mac/FFMPEG-LICENSE.txt FFMPEG-LICENSE.txt
          for b in ffmpeg ffprobe; do
            lipo -info ffmpeg-mac/$b
            lipo -info ffmpeg-mac/$b | grep -q "x86_64" && lipo -info ffmpeg-mac/$b | grep -q "arm64"
            # only Apple's own system libraries may be linked (dependency lines are indented)
            if otool -L ffmpeg-mac/$b | grep -E '^[[:space:]]' | grep -v -E '^[[:space:]]*(/usr/lib/|/System/Library/)'; then echo "$b links a non-system library"; exit 1; fi
          done
          ffmpeg-mac/ffmpeg -hide_banner -encoders | grep -q libx264
          ffmpeg-mac/ffmpeg -hide_banner -version | head -1

      - name: Test the video engine on a Mac
        run: |
          exec > >(tee step.log) 2>&1
          trap 'rc=$?; [ $rc -ne 0 ] && { grep -E -i -B2 "error|panic|failed" step.log | tail -n 25; echo ===; tail -n 10 step.log; } | cut -c1-220 | perl -pe "s/%/%25/g; s/\r//g; s/\n/%0A/g" | { printf "::error title=engine test failed::"; cat; echo; }' EXIT
          set -e
          export PATH="$PWD/ffmpeg-mac:$PATH"
          T=engine-test; mkdir -p $T
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=s=1600x1000 -frames:v 1 $T/land1.jpg
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=s=900x1400 -frames:v 1 $T/port1.jpg
          ffmpeg -hide_banner -loglevel error -f lavfi -i smptebars=s=1800x1200 -frames:v 1 $T/land2.jpg
          ffmpeg -hide_banner -loglevel error -f lavfi -i mandelbrot=s=800x800 -frames:v 1 $T/sq1.png
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=s=1280x720:r=30 -f lavfi -i sine=f=440 -t 4 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest $T/clip1.mp4
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=s=720x1280:r=30 -f lavfi -i sine=f=660 -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest $T/clip2_portrait.mp4
          ffmpeg -hide_banner -loglevel error -f lavfi -i sine=f=330 -t 10 -c:a libmp3lame $T/song1.mp3 2>/dev/null || ffmpeg -hide_banner -loglevel error -f lavfi -i sine=f=330 -t 10 -c:a aac $T/song1.m4a
          [ -f $T/song1.mp3 ] || sed -i '' 's/"song1.mp3"/"song1.m4a"/' engine/examples/render_test.rs
          ffmpeg -hide_banner -loglevel error -f lavfi -i sine=f=550 -t 10 -c:a aac $T/song2.m4a
          cargo run --locked -p storypix-engine --example render_test -- "$PWD/$T" "$PWD/$T/out.mp4"
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 $T/out.mp4)
          echo "rendered $D seconds"
          awk -v d="$D" 'BEGIN { exit !(d > 12) }'
          git checkout -- engine/examples/render_test.rs

      - name: Build app (universal) + disk image
        working-directory: src-tauri
        run: |
          set -o pipefail
          npx --yes "@tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}" build --target universal-apple-darwin -- --locked 2>&1 | tee ../tauri.log || {
            { grep -E -i -B2 "error|failed" ../tauri.log | tail -n 25; echo ===; tail -n 10 ../tauri.log; } | cut -c1-220 | perl -pe 's/%/%25/g; s/\r//g; s/\n/%0A/g' | { printf '::error title=app build failed::'; cat; echo; }
            exit 1; }

      - name: Check the app starts
        run: |
          exec > >(tee check.log) 2>&1
          trap 'rc=$?; [ $rc -ne 0 ] && tail -n 30 check.log | cut -c1-220 | perl -pe "s/%/%25/g; s/\r//g; s/\n/%0A/g" | { printf "::error title=app check failed::"; cat; echo; }' EXIT
          set -e
          APP=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          ls -l "$APP/Contents/MacOS"
          for b in "$APP"/Contents/MacOS/*; do lipo -info "$b"; done
          codesign --verify --deep --verbose=2 "$APP"
          "$APP/Contents/MacOS/ffmpeg" -hide_banner -version | head -1
          BIN=$(ls "$APP"/Contents/MacOS/ | grep -v -E '^(ffmpeg|ffprobe)$' | head -1)
          "$APP/Contents/MacOS/$BIN" & PID=$!
          sleep 20
          if ! kill -0 $PID 2>/dev/null; then echo "StoryPix quit straight away"; exit 1; fi
          kill $PID || true
          echo "StoryPix started and kept running"

      - name: Package files and checksums
        run: |
          set -e
          mkdir -p dist
          cp "$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)" dist/StoryPix-Mac-beta.dmg
          (cd dist && shasum -a 256 StoryPix-Mac-beta.dmg > SHA256SUMS-mac.txt && cat SHA256SUMS-mac.txt)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: StoryPix-mac
          path: dist/*

  release:
    # Only version tags (v1.0.0 …) publish a release. This job alone may write.
    if: always() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '' && github.ref == 'refs/heads/main'))
    needs: [build, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: StoryPix-windows
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.build-mac.result == 'success'
        with:
          name: StoryPix-mac
          path: dist

      - name: Mac ffmpeg source code (GPL)
        if: needs.build-mac.result == 'success'
        env:
          FFMPEG_COMMIT: ${{ env.MAC_FFMPEG_COMMIT }}
          X264_COMMIT: ${{ env.MAC_X264_COMMIT }}
        run: |
          set -e
          src() { git init -q "$3"; git -C "$3" fetch -q --depth 1 "$1" "$2"; git -C "$3" archive --format=tar.gz --prefix="$3/" -o "$GITHUB_WORKSPACE/dist/$3-source.tar.gz" "$2"; }
          src https://github.com/FFmpeg/FFmpeg.git "$FFMPEG_COMMIT" ffmpeg-n9.0.2
          src https://github.com/mirror/x264.git "$X264_COMMIT" x264-stable
          ls -l dist

      - name: Combine checksums
        run: |
          sed -i 's/\r$//' dist/SHA256SUMS.txt
          if [ -f dist/SHA256SUMS-mac.txt ]; then cat dist/SHA256SUMS-mac.txt >> dist/SHA256SUMS.txt; rm dist/SHA256SUMS-mac.txt; fi
          cat dist/SHA256SUMS.txt

      - name: Write release notes
        run: |
          {
            echo "**StoryPix-Setup.exe**: installer (recommended)."
            echo "**StoryPix-portable.zip**: no install needed; unzip and run StoryPix.exe."
            if [ -f dist/StoryPix-Mac-beta.dmg ]; then
              echo "**StoryPix-Mac-beta.dmg**: Mac beta (macOS 11 or later, Apple Silicon and Intel). Open it and drag StoryPix to Applications."
            fi
            echo
            echo "**Seeing a warning?** StoryPix is new and not code-signed yet, so Windows is cautious:"
            echo "- Edge says *isn't commonly downloaded*: hover the download, click **⋯ → Keep → Show more → Keep anyway**."
            echo "- Blue *Windows protected your PC* box: click **More info → Run anyway**."
            echo
            if [ -f dist/StoryPix-Mac-beta.dmg ]; then
              echo "**Mac beta:** the first time, macOS says it can't check StoryPix for malware. Click **Done**, then open **System Settings → Privacy & Security** (older macOS: **System Preferences → Security & Privacy**), scroll down and click **Open Anyway** next to StoryPix within an hour. The Mac's video engine is built from FFmpeg and x264 source code, attached below as *-source.tar.gz (GPL)."
              echo
            fi
            echo "Only download StoryPix from this Releases page. To check a download is genuine, compare its SHA-256 fingerprint with the list below (Windows PowerShell: \`Get-FileHash .\\StoryPix-Setup.exe\`; Mac Terminal: \`shasum -a 256 StoryPix-Mac-beta.dmg\`)."
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md

      - name: Work out the version tag
        id: ver
        env:
          INPUT_VER: ${{ inputs.release_version }}
        run: |
          if [ -n "$INPUT_VER" ]; then
            if ! printf '%s' "$INPUT_VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "Version must look like 1.2.3"; exit 1; fi
            echo "tag=v$INPUT_VER" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: StoryPix ${{ steps.ver.outputs.tag }}
          body_path: notes.md
          files: |
            dist/StoryPix-Setup.exe
            dist/StoryPix-portable.zip
            dist/StoryPix-Mac-beta.dmg
            dist/ffmpeg-n9.0.2-source.tar.gz
            dist/x264-stable-source.tar.gz
            dist/SHA256SUMS.txt
          make_latest: true
