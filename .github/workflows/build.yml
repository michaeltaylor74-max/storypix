name: Build Windows app

# Pushes to main build a test installer (downloadable from the run's "Artifacts").
# Pushing a version tag such as v0.3.0 builds AND publishes a public release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: nothing in the build can write to the repository.
permissions:
  contents: read

env:
  # Every outside download is pinned to an exact version / fingerprint.
  FFMPEG_VERSION: "9.0.2"
  FFMPEG_SHA256: "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba"
  TAURI_CLI_VERSION: "2.12.4"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Download and verify ffmpeg (video engine)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = $env:FFMPEG_VERSION
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$v/ffmpeg-$v-essentials_build.zip" -OutFile ffmpeg.zip
          $hash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) { throw "ffmpeg download does not match the expected fingerprint ($hash). Stopping." }
          Write-Host "ffmpeg $v verified: $hash"
          Expand-Archive ffmpeg.zip -DestinationPath ffx
          $root = "ffx/ffmpeg-$v-essentials_build"
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item "$root/bin/ffmpeg.exe" src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          Copy-Item "$root/bin/ffprobe.exe" src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe
          Copy-Item "$root/LICENSE" FFMPEG-LICENSE.txt

      - name: Build app + installer
        working-directory: src-tauri
        run: npx --yes "@tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}" build -- --locked

      - name: Package files and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist, portable/PhotoStory | Out-Null
          Copy-Item target/release/photostory.exe portable/PhotoStory/PhotoStory.exe
          Copy-Item src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe portable/PhotoStory/ffmpeg.exe
          Copy-Item src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe portable/PhotoStory/ffprobe.exe
          Copy-Item FFMPEG-LICENSE.txt, THIRD-PARTY-NOTICES.md, LICENSE portable/PhotoStory/
          Compress-Archive -Path portable/PhotoStory -DestinationPath dist/PhotoStory-portable.zip
          $inst = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $inst.FullName dist/PhotoStory-Setup.exe
          Get-ChildItem dist | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PhotoStory-windows
          path: dist/*

  release:
    # Only version tags (v1.0.0 …) publish a release. This job alone may write.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: PhotoStory-windows
          path: dist

      - name: Write release notes
        run: |
          {
            echo "**PhotoStory-Setup.exe**: installer (recommended)."
            echo "**PhotoStory-portable.zip**: no install needed; unzip and run PhotoStory.exe."
            echo
            echo "Only download PhotoStory from this Releases page. To check a download is genuine, compare its SHA-256 fingerprint with the list below (PowerShell: \`Get-FileHash .\\PhotoStory-Setup.exe\`)."
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: PhotoStory ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/PhotoStory-Setup.exe
            dist/PhotoStory-portable.zip
            dist/SHA256SUMS.txt
          make_latest: true
