name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Download ffmpeg (video engine)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          } catch {
            Write-Host "gyan.dev failed, using BtbN build"
            Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffx
          $ff = Get-ChildItem ffx -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $fp = Get-ChildItem ffx -Recurse -Filter ffprobe.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item $ff.FullName src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          Copy-Item $fp.FullName src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe
          & src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -version | Select-Object -First 1

      - name: Build app + installer
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build

      - name: Make portable zip
        shell: pwsh
        run: |
          $v = "${{ github.run_number }}"
          New-Item -ItemType Directory -Force portable/PhotoStory | Out-Null
          Copy-Item target/release/photostory.exe portable/PhotoStory/PhotoStory.exe
          Copy-Item src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe portable/PhotoStory/ffmpeg.exe
          Copy-Item src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe portable/PhotoStory/ffprobe.exe
          Compress-Archive -Path portable/PhotoStory -DestinationPath "PhotoStory-portable.zip"
          $inst = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $inst.FullName "PhotoStory-Setup.exe"
          Get-ChildItem PhotoStory-*

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoStory-windows
          path: |
            PhotoStory-Setup.exe
            PhotoStory-portable.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PhotoStory (build ${{ github.run_number }})
          body: |
            **PhotoStory-Setup.exe** — installer (recommended).
            **PhotoStory-portable.zip** — no install needed; unzip and run PhotoStory.exe.
          files: |
            PhotoStory-Setup.exe
            PhotoStory-portable.zip
          make_latest: true
