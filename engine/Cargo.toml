[package]
name = "photostory-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff", "rayon"] }
kamadak-exif = "0.6"
rayon = "1"
chrono = "0.4"
anyhow = "1"
base64 = "0.22"
